<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>墨刀开源版 · Modao Open</title>
<link rel="stylesheet" href="./css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='4' y='2.5' width='16' height='19' rx='2.5' fill='%231677ff'/><rect x='7.5' y='11' width='9' height='3.4' rx='1' fill='white'/><rect x='7.5' y='16' width='9' height='3.4' rx='1' fill='white'/></svg>">
</head>
<body>
  <div class="error-bar" id="errorBar" hidden>
    <span id="errorText"></span>
    <button class="mini" id="errorClose" title="关闭提示">✕</button>
  </div>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="4" y="2.5" width="16" height="19" rx="2.5" fill="#1677ff"/>
        <rect x="7.5" y="7.5" width="9" height="2.6" rx="1" fill="#fff"/>
        <rect x="7.5" y="12" width="9" height="3.4" rx="1" fill="#fff"/>
        <rect x="7.5" y="17" width="9" height="2.2" rx="1" fill="#fff"/>
      </svg>
      <input id="projectName" class="project-name" value="未命名原型" spellcheck="false">
    </div>

    <div class="toolbar" id="toolbar">
      <div class="tb-group">
        <button class="icon-btn" data-act="undo" title="撤销 (Ctrl+Z)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h9a5 5 0 0 1 0 10h-3"/></svg>
        </button>
        <button class="icon-btn" data-act="redo" title="重做 (Ctrl+Shift+Z)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9h-9a5 5 0 0 0 0 10h3"/></svg>
        </button>
      </div>
      <span class="sep"></span>
      <select id="deviceSelect" class="tb-select" title="画布设备"></select>
      <span class="sep"></span>
      <div class="tb-group">
        <button class="icon-btn" data-act="zoom-out" title="缩小">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.6-4.6M8 11h6"/></svg>
        </button>
        <span id="zoomLabel" class="zoom-label">100%</span>
        <button class="icon-btn" data-act="zoom-in" title="放大">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"/><path d="M20 20l-4.6-4.6M8 11h6M11 8v6"/></svg>
        </button>
        <button class="icon-btn" data-act="zoom-fit" title="适应窗口">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
        </button>
      </div>
      <span class="sep"></span>
      <div class="tb-group">
        <button class="icon-btn" data-act="toggle-grid" title="网格参考线" id="gridBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M9 3.5v17M15 3.5v17M3.5 9h17M3.5 15h17"/></svg>
        </button>
        <button class="icon-btn" data-act="toggle-links" title="显示交互连线" id="linkBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="6" r="2.6"/><circle cx="18" cy="18" r="2.6"/><path d="M8.2 8.2l7.6 7.6"/></svg>
        </button>
        <button class="icon-btn" data-act="inspect" title="标注模式：点元素看规格、导切图" id="inspectBtn">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="2"/><path d="M3.5 8.5h17M8.5 3.5v17"/></svg>
        </button>
      </div>
      <span class="sep"></span>
      <button class="icon-btn" data-act="theme" title="切换主题" id="themeBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/></svg>
      </button>
      <button class="icon-btn" data-act="help" title="帮助与快捷键（按 ?）" id="helpBtn">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.4a2.6 2.6 0 1 1 3.6 2.4c-.8.34-1.1.9-1.1 1.8"/><circle cx="12" cy="17.3" r="0.9" fill="currentColor" stroke="none"/></svg>
      </button>
    </div>

    <div class="right-actions">
      <span class="save-dot" id="saveDot" title="已保存"></span>
      <button class="tb" data-act="preset" title="载入课程作业四页示例">作业示例</button>
      <button class="tb" data-act="templates" title="页面模板库：一键新建常见页面">模板</button>
      <button class="tb ai" data-act="ai" title="AI 生成（自带 API Key）">AI 生成</button>
      <button class="tb" data-act="preview" title="预览演示">预览</button>
      <button class="tb" data-act="spec" title="生成规格清单">规格</button>
      <button class="tb" data-act="export" title="导出 PNG / 演示 HTML / 项目 JSON">导出</button>
      <button class="tb" data-act="open" title="打开项目文件">打开</button>
    </div>
  </header>

  <div class="body">

    <aside class="left">
      <div class="pane" id="panePages" style="flex:0 0 28%">
        <div class="pane-title">
          <span>页面</span>
          <button class="mini" id="addPage" title="新建页面">＋</button>
        </div>
        <div id="pageList" class="page-list"></div>
      </div>

      <div class="resizer" title="拖动调整高度"></div>

      <div class="pane" id="paneLayers" style="flex:0 0 24%">
        <div class="pane-title"><span>图层</span></div>
        <div id="layerList" class="layer-list"></div>
      </div>

      <div class="resizer" title="拖动调整高度"></div>

      <div class="pane" id="paneLibrary" style="flex:1 1 auto">
        <div class="pane-title"><span>组件</span></div>
        <div class="lib-search-wrap">
          <input id="libSearch" class="lib-search" placeholder="搜索组件…" autocomplete="off" spellcheck="false">
        </div>
        <div id="library" class="library"></div>
      </div>
    </aside>

    <main class="stage" id="stage">
      <div class="stage-scroll" id="stageScroll">
        <div class="canvas-wrap" id="canvasWrap">
          <div class="canvas-host" id="canvasHost">
            <div class="links-layer" id="linksLayer"></div>
            <div class="nodes-layer" id="nodesLayer"></div>
            <div class="hints-layer" id="hintsLayer"></div>
          </div>
        </div>
      </div>

      <div class="empty-guide" id="emptyGuide" hidden>
        <div class="eg-title">开始画第一个页面</div>
        <ol class="eg-steps">
          <li>左边组件库点一下，元素就加到画布</li>
          <li>拖动手柄改尺寸，右侧面板改样式</li>
          <li>顶部「预览」看效果，「导出」交作业</li>
        </ol>
        <div class="eg-actions">
          <button class="tb" data-act="preset">载入作业示例</button>
        </div>
      </div>
    </main>

    <aside class="right">
      <div class="pane-title"><span>属性</span></div>
      <div id="inspector" class="inspector"></div>
    </aside>

  </div>

  <div id="toast" class="toast"></div>

  <div id="modal" class="modal" hidden>
    <div class="modal-box">
      <div class="modal-head">
        <strong id="modalTitle">标题</strong>
        <button class="mini" id="modalClose">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-foot" id="modalFoot"></div>
    </div>
  </div>

  <div id="previewMask" class="preview-mask" hidden>
    <div class="preview-frame">
      <div class="preview-toolbar">
        <span id="previewDevice">预览</span>
        <span class="spacer"></span>
        <button class="mini" id="previewRestart">重播</button>
        <button class="mini" id="previewClose">关闭</button>
      </div>
      <div id="previewHost" class="preview-host"></div>
    </div>
  </div>

</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
