<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>icon picker preview</title>
<link rel="stylesheet" href="../css/app.css">
<style>body{background:#14171c;margin:0;padding:12px;width:300px;}</style>
</head>
<body>
<div id="host"></div>
<script type="module">
import { Store } from '../src/store.js';
import { createProject } from '../src/model.js';
import { renderInspector } from '../src/inspector.js';

const s = new Store();
s.state.project = createProject('图标');
const n = s.addNode('icon', { x: 40, y: 40, w: 32, h: 32, icon: 'chat', color: '#1677ff' });
s.select([n.id]);

renderInspector(document.getElementById('host'), s, {
  update(id, patch) { s.updateNode(id, patch); },
  toast() {}, align() {},
  bringForward() {}, sendBackward() {}, bringToFront() {}, sendToBack() {}
});
document.title = 'icon picker ready';
</script>
</body>
</html>
