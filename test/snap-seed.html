<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>seed snapshots</title>
</head>
<body>
<pre id="out">seeding…</pre>
<script type="module">
import { clearSnapshots, saveSnapshot } from '../src/snapshots.js';
import { createProject } from '../src/model.js';
import { Store } from '../src/store.js';

clearSnapshots();

const s = new Store();
s.state.project = createProject('课程作业原型');
s.addNode('text', { x: 20, y: 40, w: 300, h: 30, text: '校园助手' });
s.addNode('button', { x: 40, y: 300, w: 320, h: 44, text: '登录' });
saveSnapshot(s.project, '改版前的稳定版');

s.addNode('input', { x: 40, y: 200, w: 320, h: 48, text: '手机号' });
saveSnapshot(s.project, '加了登录表单');

s.addPage('待办列表页');
s.setActivePage(s.project.pages[1].id);
s.addNode('navbar', { x: 0, y: 0, w: 402, h: 88, text: '待办' });
saveSnapshot(s.project, '补了列表页');

document.getElementById('out').textContent = 'seeded';
location.replace('/?snapshots=1');
</script>
</body>
</html>
