/**
 * 右侧属性面板
 */




function el(tag, props = {}, children = []) {
  const node = document.createElement(tag);
  for (const k in props) {
    if (!Object.prototype.hasOwnProperty.call(props, k)) continue;
    if (k === 'text') node.textContent = props[k];
    else if (k === 'style') Object.assign(node.style, props[k]);
    else if (k.startsWith('on') && typeof props[k] === 'function') node.addEventListener(k.slice(2).toLowerCase(), props[k]);
    else if (k === 'class') node.className = props[k];
    else if (props[k] != null) node.setAttribute(k, props[k]);
  }
  for (const c of [].concat(children)) {
    if (c == null) continue;
    node.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
  }
  return node;
}

const COLLAPSE_KEY = 'modao-open:collapsed-groups';

function loadCollapsed() {
  try { return JSON.parse(localStorage.getItem(COLLAPSE_KEY) || '{}'); } catch (e) { return {}; }
}

function saveCollapsed(map) {
  try { localStorage.setItem(COLLAPSE_KEY, JSON.stringify(map)); } catch (e) { /* 忽略 */ }
}

function group(title, rows) {
  const g = el('div', { class: 'group' });
  const collapsed = !!loadCollapsed()[title];
  if (collapsed) g.classList.add('collapsed');

  const head = el('div', { class: 'group-title group-head' });
  const caret = el('span', { class: 'caret' });
  const cs = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  cs.setAttribute('width', '10');
  cs.setAttribute('height', '10');
  cs.setAttribute('viewBox', '0 0 24 24');
  cs.setAttribute('fill', 'none');
  cs.setAttribute('stroke', 'currentColor');
  cs.setAttribute('stroke-width', '2.6');
  cs.setAttribute('stroke-linecap', 'round');
  cs.setAttribute('stroke-linejoin', 'round');
  const cp = document.createElementNS('http://www.w3.org/2000/svg', 'path');
  cp.setAttribute('d', 'M9 6l6 6-6 6');
  cs.appendChild(cp);
  caret.appendChild(cs);
  head.appendChild(caret);
  head.appendChild(el('span', { text: title }));

  const body = el('div', { class: 'group-body' });
  for (const r of rows) if (r) body.appendChild(r);
  if (collapsed) body.style.display = 'none';

  head.addEventListener('click', () => {
    const map = loadCollapsed();
    map[title] = !map[title];
    saveCollapsed(map);
    const now = !!map[title];
    g.classList.toggle('collapsed', now);
    body.style.display = now ? 'none' : '';
  });

  g.appendChild(head);
  g.appendChild(body);
  return g;
}

function numField(label, value, onChange, opts = {}) {
  const wrap = el('div', { class: 'field' });
  wrap.appendChild(el('span', { text: label }));
  const input = el('input', {
    type: 'number',
    value: String(value == null ? 0 : value),
    step: opts.step || '1',
    min: opts.min != null ? String(opts.min) : null
  });
  input.addEventListener('change', () => {
    let v = Number(input.value);
    if (!isFinite(v)) v = 0;
    if (opts.min != null) v = Math.max(opts.min, v);
    onChange(v);
  });
  wrap.appendChild(input);
  return wrap;
}

function textField(label, value, onChange) {
  const wrap = el('div', { class: 'field' });
  if (label) wrap.appendChild(el('span', { text: label }));
  const input = el('input', { type: 'text', value: value == null ? '' : String(value) });
  input.addEventListener('change', () => onChange(input.value));
  wrap.appendChild(input);
  return wrap;
}

function colorField(label, value, onChange) {
  const wrap = el('div', { class: 'field' });
  if (label) wrap.appendChild(el('span', { text: label }));
  const picker = el('input', { type: 'color' });
  const text = el('input', { type: 'text', value: value || '#ffffff' });
  const isHex = /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(value || '');
  picker.value = isHex ? (value.length === 4 ? expandHex(value) : value) : '#ffffff';
  picker.addEventListener('input', () => {
    text.value = picker.value;
    onChange(picker.value);
  });
  text.addEventListener('change', () => {
    if (/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(text.value)) {
      picker.value = text.value.length === 4 ? expandHex(text.value) : text.value;
      onChange(text.value);
    }
  });
  wrap.appendChild(picker);
  wrap.appendChild(text);
  wrap.style.flex = '1';
  return wrap;
}

function expandHex(v) {
  return '#' + v[1] + v[1] + v[2] + v[2] + v[3] + v[3];
}

function seg(options, activeValue, onPick) {
  const wrap = el('div', { class: 'seg' });
  for (const o of options) {
    const b = el('button', { type: 'button', text: o.label });
    if (o.value === activeValue) b.classList.add('on');
    b.addEventListener('click', () => onPick(o.value));
    wrap.appendChild(b);
  }
  return wrap;
}

function renderInspector(container, store, handlers) {
  container.textContent = '';
  const node = store.selectedNode;
  const dev = store.device;

  if (!node) {
    const pageRows = [];
    const devSelect = el('select');
    for (const d of DEVICES) {
      const opt = el('option', { value: d.id, text: d.label });
      if (d.id === store.page.deviceId) opt.selected = true;
      devSelect.appendChild(opt);
    }
    devSelect.addEventListener('change', () => store.setDevice(devSelect.value));
    const devWrap = el('div', { class: 'row' }, [devSelect]);
    pageRows.push(el('div', { class: 'row' }, [el('span', { class: 'group-title', text: '画布设备', style: { margin: '0 8px 0 0' } }), devWrap]));
    pageRows.push(el('div', { class: 'row' }, [
      numField('宽', dev.w, (v) => store.setCustomSize(v, store.device.h), { min: 120 }),
      numField('高', dev.h, (v) => store.setCustomSize(store.device.w, v), { min: 200 })
    ]));
    if (store.page.customW) {
      const resetBtn = el('button', { class: 'tb', text: '恢复预设尺寸' });
      resetBtn.style.width = '100%';
      resetBtn.addEventListener('click', () => store.clearCustomSize());
      pageRows.push(el('div', { class: 'row' }, [resetBtn]));
    }
    pageRows.push(el('div', { class: 'row' }, [colorField('背景', store.page.bg || '#ffffff', (v) => store.setPageBg(v))]));

    container.appendChild(group('页面', pageRows));

    /* 变量（项目级） */
    const varRows = [];
    const vars = store.project.variables || [];
    if (!vars.length) {
      varRows.push(el('div', {
        class: 'empty-hint',
        text: '还没有变量。变量可以被交互赋值，也能用「条件」控制某个行为是否执行。'
      }));
    }
    for (const v of vars) {
      const row = el('div', { class: 'row' });
      const nameWrap = el('div', { class: 'field', style: { flex: '1' } });
      const nameInput = el('input', { type: 'text', value: v.name });
      nameInput.addEventListener('change', () => store.updateVariable(v.id, { name: nameInput.value.trim() || v.name }));
      nameWrap.appendChild(nameInput);
      row.appendChild(nameWrap);

      const valWrap = el('div', { class: 'field', style: { flex: '1' } });
      const valInput = el('input', { type: 'text', value: v.value });
      valInput.addEventListener('change', () => store.updateVariable(v.id, { value: valInput.value }));
      valWrap.appendChild(valInput);
      row.appendChild(valWrap);

      const delBtn = el('button', { class: 'mini', text: '✕', title: '删除变量' });
      delBtn.addEventListener('click', () => store.removeVariable(v.id));
      row.appendChild(delBtn);
      varRows.push(row);
    }
    const addVarBtn = el('button', { class: 'tb', text: '＋ 添加变量' });
    addVarBtn.style.width = '100%';
    addVarBtn.addEventListener('click', () => {
      store.addVariable('var' + ((store.project.variables || []).length + 1), '');
    });
    varRows.push(el('div', { class: 'row' }, [addVarBtn]));
    container.appendChild(group('变量（项目级）', varRows));

    container.appendChild(group('选中说明', [
      el('div', { class: 'empty-hint' }, [
        '点画布里的元素来改属性。',
        el('br'),
        '左侧组件库点一下就能加进来。',
        el('br'),
        el('br'),
        '快捷键：',
        el('br'),
        el('kbd', { text: 'Del' }), ' 删除　',
        el('kbd', { text: 'Ctrl+D' }), ' 复制',
        el('br'),
        el('kbd', { text: 'Ctrl+Z' }), ' 撤销　',
        el('kbd', { text: 'Ctrl+Shift+Z' }), ' 重做',
        el('br'),
        el('kbd', { text: '方向键' }), ' 微调位置'
      ])
    ]));
    return;
  }

  /* ---------- 位置与尺寸 ---------- */
  container.appendChild(group('位置与尺寸', [
    el('div', { class: 'row' }, [
      numField('X', node.x, (v) => handlers.update(node.id, { x: v })),
      numField('Y', node.y, (v) => handlers.update(node.id, { y: v }))
    ]),
    el('div', { class: 'row' }, [
      numField('宽', node.w, (v) => handlers.update(node.id, { w: v }), { min: 1 }),
      numField('高', node.h, (v) => handlers.update(node.id, { h: v }), { min: 1 })
    ]),
    el('div', { class: 'row' }, [
      numField('圆角', node.radius || 0, (v) => handlers.update(node.id, { radius: v }), { min: 0 }),
      numField('旋转', node.rotation || 0, (v) => handlers.update(node.id, { rotation: v }), { step: '1' })
    ])
  ]));

  /* ---------- 外观 ---------- */
  const fillValue = node.bg === 'transparent' ? '#ffffff' : node.bg;
  container.appendChild(group('外观', [
    el('div', { class: 'row' }, [
      el('span', { class: 'group-title', text: '填充', style: { margin: 0 } }),
      el('label', { style: { display: 'flex', alignItems: 'center', gap: '4px', fontSize: '11px', color: 'var(--text-dim)' } }, [
        (() => {
          const cb = el('input', { type: 'checkbox' });
          cb.checked = node.bg !== 'transparent';
          cb.addEventListener('change', () => handlers.update(node.id, { bg: cb.checked ? (isHexish(fillValue) ? fillValue : '#f5f5f5') : 'transparent' }));
          return cb;
        })(),
        '填充'
      ])
    ]),
    el('div', { class: 'row' }, [colorField(null, isHexish(fillValue) ? fillValue : '#f5f5f5', (v) => handlers.update(node.id, { bg: v }))]),
    el('div', { class: 'row' }, [
      numField('描边', node.borderWidth || 0, (v) => handlers.update(node.id, { borderWidth: v }), { min: 0 }),
      colorField(null, node.borderColor || '#e5e5e5', (v) => handlers.update(node.id, { borderColor: v }))
    ]),
    el('div', { class: 'row' }, [
      numField('透明度', Math.round((node.opacity == null ? 1 : node.opacity) * 100), (v) => handlers.update(node.id, { opacity: Math.max(0, Math.min(100, v)) / 100 }), { min: 0 })
    ])
  ]));

  /* ---------- 文字 ---------- */
  const hasText = ['text', 'button', 'input', 'textarea', 'badge', 'listitem', 'navbar', 'image', 'rect', 'card'].indexOf(node.type) >= 0;
  if (hasText) {
    container.appendChild(group('文字', [
      el('div', { class: 'row' }, [
        (() => {
          const ta = el('textarea', { class: 'full', rows: '2' });
          ta.value = node.text || '';
          ta.addEventListener('change', () => handlers.update(node.id, { text: ta.value }));
          return ta;
        })()
      ]),
      el('div', { class: 'row' }, [
        numField('字号', node.fontSize || 16, (v) => handlers.update(node.id, { fontSize: v }), { min: 1 }),
        numField('行高', node.lineHeight || 1.4, (v) => handlers.update(node.id, { lineHeight: v }), { step: '0.1', min: 0.8 })
      ]),
      el('div', { class: 'row' }, [
        colorField('颜色', isHexish(node.color) ? node.color : '#222222', (v) => handlers.update(node.id, { color: v }))
      ]),
      el('div', { class: 'row' }, [
        seg([
          { label: '常规', value: 400 },
          { label: '中粗', value: 500 },
          { label: '加粗', value: 700 }
        ], node.fontWeight || 400, (v) => handlers.update(node.id, { fontWeight: v }))
      ]),
      el('div', { class: 'row' }, [
        seg([
          { label: '左', value: 'left' },
          { label: '中', value: 'center' },
          { label: '右', value: 'right' }
        ], node.align || 'left', (v) => handlers.update(node.id, { align: v }))
      ])
    ]));
  }

  /* ---------- 组件特有 ---------- */
  const specific = [];

  if (node.type === 'image') {
    const upBtn = el('button', { class: 'tb', text: node.src ? '更换图片' : '上传图片' });
    upBtn.style.width = '100%';
    upBtn.addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'image/*';
      input.addEventListener('change', async () => {
        const file = input.files && input.files[0];
        if (!file) return;
        try {
          const r = await compressImageFile(file, 900, 0.82);
          handlers.update(node.id, { src: r.dataUrl, text: '' });
          handlers.toast('已插入图片 ' + r.width + '×' + r.height + '（' + Math.round(r.dataUrl.length / 1024) + ' KB）');
        } catch (e) {
          handlers.toast('图片处理失败：' + e.message);
        }
      });
      input.click();
    });
    specific.push(el('div', { class: 'row' }, [upBtn]));

    if (node.src) {
      const clrBtn = el('button', { class: 'tb', text: '清除图片' });
      clrBtn.style.width = '100%';
      clrBtn.addEventListener('click', () => handlers.update(node.id, { src: '' }));
      specific.push(el('div', { class: 'row' }, [clrBtn]));
    }

    specific.push(el('div', { class: 'row' }, [
      seg([
        { label: '裁剪铺满', value: 'cover' },
        { label: '完整显示', value: 'contain' }
      ], node.fit || 'cover', (v) => handlers.update(node.id, { fit: v }))
    ]));
    specific.push(el('div', { class: 'empty-hint', text: '图片会压缩到最长边 900px 后存进项目文件。' }));
  }

  if (node.type === 'icon') {
    const select = el('select');
    for (const name of ICON_NAMES) {
      const o = el('option', { value: name, text: name });
      if (name === (node.icon || 'heart')) o.selected = true;
      select.appendChild(o);
    }
    select.addEventListener('change', () => handlers.update(node.id, { icon: select.value }));
    specific.push(el('div', { class: 'row' }, [select]));
    specific.push(el('div', { class: 'row' }, [numField('线宽', node.strokeWidth || 1.7, (v) => handlers.update(node.id, { strokeWidth: v }), { step: '0.1', min: 0.5 })]));
  }

  if (node.type === 'checkbox') {
    specific.push(el('div', { class: 'row' }, [
      seg([{ label: '未选', value: 'o' }, { label: '已选', value: 'c' }], node.checked ? 'c' : 'o', (v) => handlers.update(node.id, { checked: v === 'c' }))
    ]));
  }

  if (node.type === 'switch') {
    specific.push(el('div', { class: 'row' }, [
      seg([{ label: '关', value: 'off' }, { label: '开', value: 'on' }], node.on ? 'on' : 'off', (v) => handlers.update(node.id, { on: v === 'on' }))
    ]));
  }

  if (node.type === 'tabbar') {
    specific.push(el('div', { class: 'row' }, [
      textField('标签', (node.tabs || []).join(','), (v) => handlers.update(node.id, { tabs: v.split(/[,，]/).map((s) => s.trim()).filter(Boolean) }))
    ]));
    specific.push(el('div', { class: 'row' }, [
      numField('当前', node.activeIndex || 0, (v) => handlers.update(node.id, { activeIndex: v }), { min: 0 })
    ]));
    specific.push(el('div', { class: 'row' }, [
      colorField('选中色', node.activeColor || '#1677ff', (v) => handlers.update(node.id, { activeColor: v }))
    ]));
    specific.push(el('div', { class: 'row' }, [
      colorField('未选色', node.inactiveColor || '#999999', (v) => handlers.update(node.id, { inactiveColor: v }))
    ]));
  }

  if (node.type === 'navbar') {
    specific.push(el('div', { class: 'row' }, [
      seg([{ label: '无返回', value: 'n' }, { label: '返回', value: 'y' }], node.showBack ? 'y' : 'n', (v) => handlers.update(node.id, { showBack: v === 'y' }))
    ]));
    specific.push(el('div', { class: 'row' }, [
      seg([{ label: '无按钮', value: 'n' }, { label: '右侧按钮', value: 'y' }], node.showAction ? 'y' : 'n', (v) => handlers.update(node.id, { showAction: v === 'y' }))
    ]));
    const select = el('select');
    for (const name of ICON_NAMES) {
      const o = el('option', { value: name, text: name });
      if (name === (node.actionIcon || 'plus')) o.selected = true;
      select.appendChild(o);
    }
    select.addEventListener('change', () => handlers.update(node.id, { actionIcon: select.value }));
    specific.push(el('div', { class: 'row' }, [select]));
  }

  if (node.type === 'listitem') {
    specific.push(el('div', { class: 'row' }, [
      seg([{ label: '无分割线', value: 'n' }, { label: '有分割线', value: 'y' }], node.divider ? 'y' : 'n', (v) => handlers.update(node.id, { divider: v === 'y' }))
    ]));
  }

  if (specific.length) container.appendChild(group('组件设置', specific));

  /* ---------- 交互 ---------- */
  const pages = store.project.pages.filter((p) => p.id !== store.page.id);
  const linkRows = [];
  const currentAction = node.link ? node.link.action : 'none';
  const currentTrigger = (node.link && node.link.trigger) || 'click';

  const triggerSelect = el('select');
  for (const t of TRIGGERS) {
    const o = el('option', { value: t.value, text: t.label });
    if (t.value === currentTrigger) o.selected = true;
    triggerSelect.appendChild(o);
  }
  triggerSelect.disabled = currentAction === 'none';
  triggerSelect.addEventListener('change', () => {
    const patch = Object.assign({}, node.link || { action: 'navigate' }, { trigger: triggerSelect.value });
    handlers.update(node.id, { link: patch });
  });

  const actionSelect = el('select');
  for (const a of ACTIONS) {
    const o = el('option', { value: a.value, text: a.label });
    if (a.value === currentAction) o.selected = true;
    actionSelect.appendChild(o);
  }

  linkRows.push(el('div', { class: 'row' }, [
    el('span', { class: 'group-title', text: '触发', style: { margin: '0 4px 0 0', fontSize: '11px' } }),
    triggerSelect
  ]));

  if (currentTrigger === 'keydown') {
    const keyInput = el('input', { type: 'text', value: (node.link && node.link.keyName) || 'Enter' });
    keyInput.style.cssText = 'flex:1;background:var(--bg-input);border:1px solid var(--line);border-radius:5px;color:var(--text);padding:4px 6px;font-size:12px;';
    keyInput.placeholder = 'Enter / Escape / a …';
    keyInput.addEventListener('change', () => {
      const next = Object.assign({}, node.link || { action: 'navigate' }, { keyName: keyInput.value.trim() || 'Enter' });
      handlers.update(node.id, { link: next });
    });
    linkRows.push(el('div', { class: 'row' }, [keyInput]));
  }
  linkRows.push(el('div', { class: 'row' }, [
    el('span', { class: 'group-title', text: '行为', style: { margin: '0 4px 0 0', fontSize: '11px' } }),
    actionSelect
  ]));

  const keep = () => Object.assign({ trigger: currentTrigger }, node.link || {});

  /* 条件（可选）：不满足则整个行为不执行 */
  const projectVars = store.project.variables || [];
  const condVarSelect = el('select');
  condVarSelect.appendChild(el('option', { value: '', text: '无条件（总是执行）' }));
  for (const v of projectVars) {
    const o = el('option', { value: v.name, text: v.name });
    if (node.link && node.link.condition && node.link.condition.varName === v.name) o.selected = true;
    condVarSelect.appendChild(o);
  }
  condVarSelect.disabled = currentAction === 'none';
  condVarSelect.addEventListener('change', () => {
    const vn = condVarSelect.value;
    const next = Object.assign({}, node.link || { action: 'navigate' });
    if (!vn) delete next.condition;
    else next.condition = { varName: vn, op: 'truthy', value: '' };
    handlers.update(node.id, { link: next });
  });
  linkRows.push(el('div', { class: 'row' }, [
    el('span', { class: 'group-title', text: '条件', style: { margin: '0 4px 0 0', fontSize: '11px' } }),
    condVarSelect
  ]));

  const cond = node.link && node.link.condition;
  if (cond && cond.varName) {
    const opSelect = el('select');
    for (const op of CONDITION_OPS) {
      const o = el('option', { value: op.value, text: op.label });
      if (op.value === (cond.op || 'truthy')) o.selected = true;
      opSelect.appendChild(o);
    }
    opSelect.addEventListener('change', () => {
      const next = Object.assign({}, node.link);
      next.condition = Object.assign({}, cond, { op: opSelect.value });
      handlers.update(node.id, { link: next });
    });
    linkRows.push(el('div', { class: 'row' }, [opSelect]));

    if (cond.op === 'eq' || cond.op === 'neq') {
      const condValInput = el('input', { type: 'text', value: cond.value || '' });
      condValInput.style.cssText = 'flex:1;background:var(--bg-input);border:1px solid var(--line);border-radius:5px;color:var(--text);padding:4px 6px;font-size:12px;';
      condValInput.addEventListener('change', () => {
        const next = Object.assign({}, node.link);
        next.condition = Object.assign({}, cond, { value: condValInput.value });
        handlers.update(node.id, { link: next });
      });
      linkRows.push(el('div', { class: 'row' }, [condValInput]));
    }
  }

  if (currentAction === 'navigate') {
    if (!pages.length) {
      linkRows.push(el('div', { class: 'empty-hint', text: '还没有其他页面，先新建一个页面。' }));
    } else {
      const pageSelect = el('select');
      for (const p of pages) {
        const o = el('option', { value: p.id, text: p.name });
        if (node.link && node.link.targetPageId === p.id) o.selected = true;
        pageSelect.appendChild(o);
      }
      pageSelect.addEventListener('change', () => {
        handlers.update(node.id, { link: Object.assign(keep(), { action: 'navigate', targetPageId: pageSelect.value }) });
      });
      linkRows.push(el('div', { class: 'row' }, [pageSelect]));
    }
  } else if (currentAction === 'url') {
    const urlInput = el('input', { type: 'text', value: (node.link && node.link.url) || 'https://' });
    urlInput.style.cssText = 'flex:1;background:var(--bg-input);border:1px solid var(--line);border-radius:5px;color:var(--text);padding:4px 6px;font-size:12px;';
    urlInput.addEventListener('change', () => {
      handlers.update(node.id, { link: Object.assign(keep(), { action: 'url', url: urlInput.value.trim() }) });
    });
    linkRows.push(el('div', { class: 'row' }, [urlInput]));
    linkRows.push(el('div', { class: 'empty-hint', text: '预览时点开会在新标签打开这个地址。' }));
  } else if (currentAction === 'state') {
    const targets = store.page.nodes.filter((n) => n.id !== node.id && n.states && n.states.length);
    if (!targets.length) {
      linkRows.push(el('div', { class: 'empty-hint', text: '本页还没有带状态的组件。先选中一个组件，在下面「组件状态」里添加状态。' }));
    } else {
      const nodeSelect = el('select');
      for (const n of targets) {
        const o = el('option', { value: n.id, text: (n.name || n.type) + ' · ' + n.states.length + ' 个状态' });
        if (node.link && node.link.targetNodeId === n.id) o.selected = true;
        nodeSelect.appendChild(o);
      }
      linkRows.push(el('div', { class: 'row' }, [nodeSelect]));

      const currentTargetId = (node.link && node.link.targetNodeId) || targets[0].id;
      const targetNode = targets.find((n) => n.id === currentTargetId) || targets[0];

      const stateSelect = el('select');
      const loopOpt = el('option', { value: '', text: '循环切到下一个状态' });
      stateSelect.appendChild(loopOpt);
      for (const st of targetNode.states) {
        const o = el('option', { value: st.id, text: st.name });
        if (node.link && node.link.targetStateId === st.id) o.selected = true;
        stateSelect.appendChild(o);
      }
      linkRows.push(el('div', { class: 'row' }, [stateSelect]));

      nodeSelect.addEventListener('change', () => {
        handlers.update(node.id, {
          link: Object.assign(keep(), { action: 'state', targetNodeId: nodeSelect.value, targetStateId: null })
        });
      });
      stateSelect.addEventListener('change', () => {
        handlers.update(node.id, {
          link: Object.assign(keep(), {
            action: 'state', targetNodeId: currentTargetId, targetStateId: stateSelect.value || null
          })
        });
      });
    }
  } else if (currentAction === 'openOverlay' || currentAction === 'closeOverlay') {
    const overlays = store.page.nodes.filter((n) => n.type === 'group' && n.overlay);
    if (!overlays.length) {
      linkRows.push(el('div', { class: 'empty-hint', text: '本页还没有浮层。先选中一个分组，在下面「浮层」里打开。' }));
    } else {
      const nodeSelect = el('select');
      for (const n of overlays) {
        const o = el('option', { value: n.id, text: (n.name || '分组') + ' · 浮层' });
        if (node.link && node.link.targetNodeId === n.id) o.selected = true;
        nodeSelect.appendChild(o);
      }
      nodeSelect.addEventListener('change', () => {
        handlers.update(node.id, { link: Object.assign(keep(), { action: currentAction, targetNodeId: nodeSelect.value }) });
      });
      linkRows.push(el('div', { class: 'row' }, [nodeSelect]));
    }
  } else if (currentAction === 'setVar') {
    if (!projectVars.length) {
      linkRows.push(el('div', { class: 'empty-hint', text: '先在上面的「变量」面板里加一个变量。' }));
    } else {
      const varSelect = el('select');
      for (const v of projectVars) {
        const o = el('option', { value: v.name, text: v.name });
        if (node.link && node.link.varName === v.name) o.selected = true;
        varSelect.appendChild(o);
      }
      const varValInput = el('input', { type: 'text', value: (node.link && node.link.varValue) || '' });
      varValInput.style.cssText = 'flex:1;background:var(--bg-input);border:1px solid var(--line);border-radius:5px;color:var(--text);padding:4px 6px;font-size:12px;';
      varValInput.placeholder = '要赋的值';

      const applyVar = () => {
        handlers.update(node.id, {
          link: Object.assign(keep(), { action: 'setVar', varName: varSelect.value, varValue: varValInput.value })
        });
      };
      varSelect.addEventListener('change', applyVar);
      varValInput.addEventListener('change', applyVar);

      linkRows.push(el('div', { class: 'row' }, [varSelect]));
      linkRows.push(el('div', { class: 'row' }, [varValInput]));
      linkRows.push(el('div', { class: 'empty-hint', text: '预览时触发就把它设成这个值，后面的行为可以用条件读它。' }));
    }
  } else if (currentAction === 'show' || currentAction === 'hide' || currentAction === 'toggle' || currentAction === 'scrollTo') {
    const nodeSelect = el('select');
    const candidates = store.page.nodes.filter((n) => n.id !== node.id);
    if (!candidates.length) {
      linkRows.push(el('div', { class: 'empty-hint', text: '本页还没有其他元素可选。' }));
    } else {
      for (const n of candidates) {
        const o = el('option', { value: n.id, text: (n.name || n.type) + ' · ' + n.id.slice(-4) });
        if (node.link && node.link.targetNodeId === n.id) o.selected = true;
        nodeSelect.appendChild(o);
      }
      nodeSelect.addEventListener('change', () => {
        handlers.update(node.id, { link: Object.assign(keep(), { action: currentAction, targetNodeId: nodeSelect.value }) });
      });
      linkRows.push(el('div', { class: 'row' }, [nodeSelect]));
    }
  }

  actionSelect.addEventListener('change', () => {
    const v = actionSelect.value;
    if (v === 'none') { handlers.update(node.id, { link: null }); return; }
    const next = { action: v, trigger: currentTrigger };
    if (v === 'navigate') next.targetPageId = pages[0] ? pages[0].id : null;
    else if (v === 'url') next.url = 'https://';
    else if (v === 'openOverlay' || v === 'closeOverlay') {
      const ov = store.page.nodes.filter((n) => n.type === 'group' && n.overlay)[0];
      next.targetNodeId = ov ? ov.id : null;
    } else if (v === 'setVar') {
      const fv = (store.project.variables || [])[0];
      next.varName = fv ? fv.name : '';
      next.varValue = '';
    } else {
      const target = store.page.nodes.filter((n) => n.id !== node.id)[0];
      next.targetNodeId = target ? target.id : null;
    }
    handlers.update(node.id, { link: next });
  });

  container.appendChild(group('交互（预览时生效）', linkRows));

  /* ---------- 浮层（仅分组） ---------- */
  if (node.type === 'group') {
    const overlayRows = [];
    overlayRows.push(el('div', { class: 'row' }, [
      seg([
        { label: '普通分组', value: 'n' },
        { label: '作为浮层', value: 'y' }
      ], node.overlay ? 'y' : 'n', (v) => store.setOverlay(node.id, { overlay: v === 'y' }))
    ]));
    if (node.overlay) {
      overlayRows.push(el('div', { class: 'row' }, [
        seg([
          { label: '无遮罩', value: 'n' },
          { label: '带遮罩', value: 'y' }
        ], node.overlayMask ? 'y' : 'n', (v) => store.setOverlay(node.id, { overlayMask: v === 'y' }))
      ]));
      overlayRows.push(el('div', { class: 'row' }, [
        seg([
          { label: '默认关闭', value: 'n' },
          { label: '默认打开', value: 'y' }
        ], node.defaultOpen ? 'y' : 'n', (v) => store.setOverlay(node.id, { defaultOpen: v === 'y' }))
      ]));
      overlayRows.push(el('div', {
        class: 'empty-hint',
        text: '浮层在预览时挂到最上层；用「打开浮层 / 关闭浮层」两个交互控制它。'
      }));
    }
    container.appendChild(group('浮层', overlayRows));
  }

  /* ---------- 组件状态（动态组件 · 外观变体） ---------- */
  const stateRows = [];
  const curState = currentState(node);
  if (node.states && node.states.length) {
    stateRows.push(el('div', {
      class: 'empty-hint',
      style: { padding: '0 2px 6px' },
      text: '当前状态：' + (curState ? curState.name : '—') + '　点“存”把现在的外观存进该状态。'
    }));
    for (const st of node.states) {
      const row = el('div', { class: 'row' });
      const nameWrap = el('div', { class: 'field', style: { flex: '1' } });
      const input = el('input', { type: 'text', value: st.name });
      input.addEventListener('change', () => {
        store.renameState(node.id, st.id, input.value.trim() || st.name);
      });
      nameWrap.appendChild(input);
      row.appendChild(nameWrap);

      const isCur = curState && curState.id === st.id;
      const curBtn = el('button', { class: 'mini', text: isCur ? '●' : '○', title: '设为当前状态' });
      curBtn.addEventListener('click', () => store.setActiveState(node.id, st.id));
      row.appendChild(curBtn);

      const saveBtn = el('button', { class: 'mini', text: '存', title: '把当前外观存进这个状态' });
      saveBtn.addEventListener('click', () => {
        store.captureStateStyle(node.id, st.id, STATE_STYLE_KEYS);
        handlers.toast('外观已存进「' + st.name + '」');
      });
      row.appendChild(saveBtn);

      const delBtn = el('button', { class: 'mini', text: '✕', title: '删除状态' });
      delBtn.addEventListener('click', () => store.removeState(node.id, st.id));
      row.appendChild(delBtn);

      stateRows.push(row);
    }
  } else {
    stateRows.push(el('div', {
      class: 'empty-hint',
      text: '添加状态后，这个组件可以有多套外观，交互里就能选「点击切换组件状态」。'
    }));
  }

  const addStateBtn = el('button', { class: 'tb', text: '＋ 添加组件状态' });
  addStateBtn.style.width = '100%';
  addStateBtn.addEventListener('click', () => {
    const st = store.addState(node.id);
    if (st) {
      store.captureStateStyle(node.id, st.id, STATE_STYLE_KEYS);
      handlers.toast('已添加状态：' + st.name);
    }
  });
  stateRows.push(el('div', { class: 'row' }, [addStateBtn]));
  container.appendChild(group('组件状态（动态组件）', stateRows));

  /* ---------- 排列 ---------- */
  const selIsGroup = node.type === 'group';
  container.appendChild(group('排列', [
    el('div', { class: 'row' }, [
      el('button', {
        class: 'tb',
        text: selIsGroup ? '解散分组' : '组合选中',
        style: { flex: '1' },
        onclick: () => {
          if (selIsGroup) {
            const n = store.ungroupSelected();
            handlers.toast('已解散，拆出 ' + n + ' 个元素');
          } else {
            const g = store.groupSelected();
            handlers.toast(g ? '已组合 ' + (g.children ? g.children.length : 0) + ' 个元素' : '至少选两个元素才能组合');
          }
        }
      })
    ]),
    el('div', { class: 'row' }, [
      el('button', { class: 'tb', text: '上移一层', style: { flex: '1' }, onclick: () => handlers.bringForward(node.id) }),
      el('button', { class: 'tb', text: '下移一层', style: { flex: '1' }, onclick: () => handlers.sendBackward(node.id) })
    ]),
    el('div', { class: 'row' }, [
      el('button', { class: 'tb', text: '置顶', style: { flex: '1' }, onclick: () => handlers.bringToFront(node.id) }),
      el('button', { class: 'tb', text: '置底', style: { flex: '1' }, onclick: () => handlers.sendToBack(node.id) })
    ]),
    el('div', { class: 'row' }, [
      el('button', { class: 'tb', text: '水平居中', style: { flex: '1' }, onclick: () => handlers.align('hcenter') }),
      el('button', { class: 'tb', text: '垂直居中', style: { flex: '1' }, onclick: () => handlers.align('vcenter') })
    ]),
    el('div', { class: 'row' }, [
      el('button', { class: 'tb', text: '复制一份', style: { flex: '1' }, onclick: () => store.duplicateSelected() }),
      el('button', { class: 'tb', text: '删除', style: { flex: '1', color: '#ff9b9d' }, onclick: () => store.deleteSelected() })
    ])
  ]));
}

function isHexish(v) {
  return typeof v === 'string' && /^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v);
}

/* ===== src/links.js ===== */
/**
 * 交互连线（画面上的可视化）与预览运行时
 */




const SVG_NS = 'http://www.w3.org/2000/svg';

const LONG_PRESS_MS = 500;
const SWIPE_MIN = 30;

/** 给预览/导出用的触发器绑定；fire 是真正的行为执行函数 */
function bindTriggers(el, link, fire, registerCleanup) {
  const trigger = (link && link.trigger) || 'click';
  const cleanup = registerCleanup || function () {};
  el.style.cursor = 'pointer';

  if (trigger === 'click') {
    el.addEventListener('click', (e) => { e.stopPropagation(); fire(); });
  } else if (trigger === 'dblclick') {
    el.addEventListener('dblclick', (e) => { e.stopPropagation(); fire(); });
  } else if (trigger === 'down') {
    el.addEventListener('pointerdown', (e) => { e.stopPropagation(); fire(); });
  } else if (trigger === 'up') {
    el.addEventListener('pointerup', (e) => { e.stopPropagation(); fire(); });
  } else if (trigger === 'contextmenu') {
    el.addEventListener('contextmenu', (e) => { e.preventDefault(); e.stopPropagation(); fire(); });
  } else if (trigger === 'mouseenter') {
    el.addEventListener('mouseenter', () => fire());
  } else if (trigger === 'mouseleave') {
    el.addEventListener('mouseleave', () => fire());
  } else if (trigger === 'keydown') {
    const want = link.keyName || 'Enter';
    const handler = (e) => {
      if (e.key === want || e.code === want) fire();
    };
    window.addEventListener('keydown', handler);
    cleanup(() => window.removeEventListener('keydown', handler));
  } else if (trigger === 'shake') {
    const handler = (ev) => {
      const a = ev.accelerationIncludingGravity || ev.acceleration;
      if (!a) return;
      const magnitude = Math.abs(a.x || 0) + Math.abs(a.y || 0) + Math.abs(a.z || 0);
      if (magnitude > 35) fire();
    };
    window.addEventListener('devicemotion', handler);
    cleanup(() => window.removeEventListener('devicemotion', handler));
  } else if (trigger === 'longpress') {
    let timer = null;
    const clear = () => { if (timer) { clearTimeout(timer); timer = null; } };
    el.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      clear();
      timer = setTimeout(() => { timer = null; fire(); }, LONG_PRESS_MS);
    });
    el.addEventListener('pointerup', clear);
    el.addEventListener('pointerleave', clear);
    el.addEventListener('pointercancel', clear);
  } else if (trigger.indexOf('swipe') === 0) {
    let sx = 0;
    let sy = 0;
    let tracking = false;
    el.addEventListener('pointerdown', (e) => {
      e.stopPropagation();
      sx = e.clientX;
      sy = e.clientY;
      tracking = true;
    });
    el.addEventListener('pointerup', (e) => {
      if (!tracking) return;
      tracking = false;
      const dx = e.clientX - sx;
      const dy = e.clientY - sy;
      const horiz = Math.abs(dx) > Math.abs(dy);
      const dist = horiz ? Math.abs(dx) : Math.abs(dy);
      if (dist < SWIPE_MIN) return;
      const dir = horiz ? (dx > 0 ? 'Right' : 'Left') : (dy > 0 ? 'Down' : 'Up');
      if ('swipe' + dir === trigger) fire();
    });
  }
  // 'load' 由调用方在渲染后立即触发，不需要绑定
}

function renderLinks(layer, store) {
  layer.textContent = '';
  if (!store.state.showLinks) return;

  const page = store.page;
  const device = store.device;
  const svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('width', String(device.w));
  svg.setAttribute('height', String(device.h));
  svg.style.position = 'absolute';
  svg.style.inset = '0';
  svg.style.overflow = 'visible';

  let count = 0;

  for (const node of page.nodes) {
    if (!node.link || !node.link.action || node.link.action === 'none') continue;
    const trig = triggerLabel(node.link.trigger || 'click');
    const from = { x: node.x + node.w, y: node.y + node.h / 2 };

    let to = null;
    let label = '';

    if (node.link.action === 'navigate') {
      const target = store.project.pages.find((p) => p.id === node.link.targetPageId);
      if (!target) continue;
      to = { x: device.w - 10, y: from.y };
      label = trig + ' → ' + target.name;
    } else if (node.link.action === 'url') {
      to = { x: device.w - 10, y: from.y };
      label = trig + ' → 链接';
    } else if (node.link.action === 'state') {
      const target = page.nodes.find((n) => n.id === node.link.targetNodeId);
      if (!target) continue;
      to = { x: target.x + target.w / 2, y: target.y + target.h / 2 };
      let stName = '下一个状态';
      if (node.link.targetStateId && target.states) {
        const st = target.states.find((s) => s.id === node.link.targetStateId);
        if (st) stName = st.name;
      }
      label = trig + ' → ' + stName;
    } else {
      const target = page.nodes.find((n) => n.id === node.link.targetNodeId);
      if (!target) continue;
      to = { x: target.x + target.w / 2, y: target.y + target.h / 2 };
      label = trig + ' → ' + actionLabel(node.link.action);
    }

    const path = document.createElementNS(SVG_NS, 'path');
    const dx = Math.max(24, Math.abs(to.x - from.x) * 0.45);
    const d = 'M ' + from.x + ' ' + from.y +
      ' C ' + (from.x + dx) + ' ' + from.y + ', ' + (to.x - dx) + ' ' + to.y + ', ' + to.x + ' ' + to.y;
    path.setAttribute('d', d);
    path.setAttribute('class', 'link-path');
    svg.appendChild(path);

    const circle = document.createElementNS(SVG_NS, 'circle');
    circle.setAttribute('cx', String(from.x));
    circle.setAttribute('cy', String(from.y));
    circle.setAttribute('r', '3');
    circle.setAttribute('fill', '#1677ff');
    svg.appendChild(circle);

    const text = document.createElementNS(SVG_NS, 'text');
    text.setAttribute('class', 'link-label');
    // 标签居中在连线中点，并夹在画布内，避免贴边被裁掉
    const midX = (from.x + to.x) / 2;
    text.setAttribute('x', String(Math.max(40, Math.min(device.w - 40, midX))));
    text.setAttribute('y', String((from.y + to.y) / 2 - 6));
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('fill', '#1677ff');
    text.setAttribute('font-size', '10');
    text.setAttribute('font-family', 'Microsoft YaHei, sans-serif');
    text.textContent = label;
    svg.appendChild(text);

    count += 1;
  }

  layer.appendChild(svg);

  // 给标签补一层白色胶囊底，避免压在元素上不好读
  try {
    for (const t of svg.querySelectorAll('text.link-label')) {
      const bb = t.getBBox();
      const bg = document.createElementNS(SVG_NS, 'rect');
      bg.setAttribute('x', String(bb.x - 4));
      bg.setAttribute('y', String(bb.y - 1.5));
      bg.setAttribute('width', String(bb.width + 8));
      bg.setAttribute('height', String(bb.height + 3));
      bg.setAttribute('rx', '3');
      bg.setAttribute('fill', 'rgba(255,255,255,0.94)');
      bg.setAttribute('stroke', 'rgba(22,119,255,0.35)');
      bg.setAttribute('stroke-width', '0.6');
      t.parentNode.insertBefore(bg, t);
    }
  } catch (e) { /* getBBox 在未布局时可能抛错，忽略 */ }

  layer.dataset.count = String(count);
}

/**
 * 预览运行时：页面跳转、显隐切换、组件状态切换、滚动到、打开链接。
 * project 传进来的应是深拷贝，运行时允许改动其 activeStateId。
 */
function createPreviewRuntime(project, startPageId, mount) {
  let currentPageId = startPageId;
  const hiddenState = new Map();
  const vars = new Map();
  const cleanups = [];
  let watchDepth = 0;
  for (const v of (project.variables || [])) {
    vars.set(v.name, String(v.value == null ? '' : v.value));
  }

  function checkCondition(link) {
    const c = link.condition;
    if (!c || !c.varName) return true;
    const actual = vars.has(c.varName) ? vars.get(c.varName) : '';
    const expect = c.value == null ? '' : String(c.value);
    if (c.op === 'truthy') return actual !== '' && actual !== '0' && actual !== 'false';
    if (c.op === 'falsy') return actual === '' || actual === '0' || actual === 'false';
    if (c.op === 'neq') return actual !== expect;
    return actual === expect;
  }

  function pageById(id) {
    return project.pages.find((p) => p.id === id) || project.pages[0];
  }

  function render() {
    while (cleanups.length) {
      try { cleanups.pop()(); } catch (e) { /* 忽略 */ }
    }
    const page = pageById(currentPageId);
    mount.textContent = '';

    const dev = page.device || { w: 402, h: 874 };
    const host = document.createElement('div');
    host.style.position = 'relative';
    host.style.width = dev.w + 'px';
    host.style.height = dev.h + 'px';
    host.style.background = page.bg || '#ffffff';
    host.style.overflow = 'hidden';

    const nodeEls = new Map();
    const overlayMasks = new Map();

    function rerenderNode(node) {
      const old = nodeEls.get(node.id);
      if (!old) return;
      const fresh = createNodeEl(node, { interactive: true });
      if (hiddenState.get(node.id) === true) fresh.style.display = 'none';
      attach(node, fresh);
      old.replaceWith(fresh);
      nodeEls.set(node.id, fresh);
    }

    function runAction(node) {
      const link = node.link;
      if (!link || !link.action || link.action === 'none') return;
      if (!checkCondition(link)) return;

      if (link.action === 'navigate') {
        if (link.targetPageId && link.targetPageId !== page.id) {
          currentPageId = link.targetPageId;
          hiddenState.clear();
          render();
        }
        return;
      }

      if (link.action === 'url') {
        if (link.url) window.open(link.url, '_blank', 'noopener');
        return;
      }

      if (link.action === 'setVar') {
        if (link.varName) vars.set(link.varName, link.varValue == null ? '' : String(link.varValue));
        runWatchers();
        return;
      }

      const target = page.nodes.find((n) => n.id === link.targetNodeId);
      if (!target) return;

      if (link.action === 'state') {
        if (!target.states || !target.states.length) return;
        if (link.targetStateId) {
          target.activeStateId = link.targetStateId;
        } else {
          const idx = target.states.findIndex((s) => s.id === target.activeStateId);
          const next = target.states[(idx + 1) % target.states.length];
          target.activeStateId = next.id;
        }
        rerenderNode(target);
        return;
      }

      if (link.action === 'openOverlay' || link.action === 'closeOverlay') {
        if (!target.overlay) return;
        const oel = nodeEls.get(target.id);
        const mask = overlayMasks.get(target.id);
        const show = link.action === 'openOverlay';
        if (oel) oel.style.display = show ? '' : 'none';
        if (mask) mask.style.display = show ? '' : 'none';
        return;
      }

      const el = nodeEls.get(target.id);
      if (!el) return;

      if (link.action === 'show') {
        el.style.display = '';
        hiddenState.set(target.id, false);
      } else if (link.action === 'hide') {
        el.style.display = 'none';
        hiddenState.set(target.id, true);
      } else if (link.action === 'toggle') {
        const isHidden = el.style.display === 'none';
        el.style.display = isHidden ? '' : 'none';
        hiddenState.set(target.id, !isHidden);
      } else if (link.action === 'scrollTo') {
        if (el.scrollIntoView) el.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
    }

    function runWatchers() {
      if (watchDepth > 3) return;
      watchDepth += 1;
      try {
        const pg = pageById(currentPageId);
        for (const n of pg.nodes) {
          if (!n.link || !n.link.action || n.link.action === 'none') continue;
          if ((n.link.trigger || 'click') !== 'watch') continue;
          if (checkCondition(n.link)) runAction(n);
        }
      } finally {
        watchDepth -= 1;
      }
    }

    function attach(node, el) {
      const link = node.link;
      if (!link || !link.action || link.action === 'none') {
        el.style.cursor = 'default';
        return;
      }
      const trigger = link.trigger || 'click';
      if (trigger === 'load' || trigger === 'watch') {
        el.style.cursor = 'default';
        return;
      }
      bindTriggers(el, link, () => runAction(node), (fn) => cleanups.push(fn));
    }

    const overlays = [];
    for (const node of page.nodes) {
      if (node.hidden) continue;
      if (node.type === 'group' && node.overlay) { overlays.push(node); continue; }
      const el = createNodeEl(node, { interactive: true });
      if (hiddenState.get(node.id) === true) el.style.display = 'none';
      attach(node, el);
      host.appendChild(el);
      nodeEls.set(node.id, el);
    }

    // 浮层挂到最上层：遮罩 + 浮层本体
    for (const node of overlays) {
      let mask = null;
      if (node.overlayMask) {
        mask = document.createElement('div');
        mask.className = 'ov-mask';
        mask.dataset.for = node.id;
        mask.style.cssText = 'position:absolute;inset:0;background:rgba(0,0,0,0.45);z-index:900;';
        if (!node.defaultOpen) mask.style.display = 'none';
        host.appendChild(mask);
      }
      const el = createNodeEl(node, { interactive: true });
      el.style.zIndex = '901';
      if (!node.defaultOpen) el.style.display = 'none';
      attach(node, el);
      host.appendChild(el);
      nodeEls.set(node.id, el);
      overlayMasks.set(node.id, mask);
    }

    mount.appendChild(host);

    // 载入时触发（延后一帧，避免与渲染打架）
    const loads = page.nodes.filter((n) => n.link && n.link.action && n.link.action !== 'none' && (n.link.trigger || 'click') === 'load');
    if (loads.length) {
      setTimeout(() => {
        for (const n of loads) runAction(n);
      }, 60);
    }
  }

  return {
    start() { render(); },
    restart() {
      currentPageId = startPageId;
      hiddenState.clear();
      for (const v of (project.variables || [])) {
        vars.set(v.name, String(v.value == null ? '' : v.value));
      }
      render();
    },
    currentPage() { return pageById(currentPageId); },
    getVar(name) { return vars.has(name) ? vars.get(name) : undefined; },
    setVar(name, value) { vars.set(name, String(value == null ? '' : value)); },
    destroy() {
      while (cleanups.length) {
        try { cleanups.pop()(); } catch (e) { /* 忽略 */ }
      }
    }
  };
}

/**
 * 导入导出：PNG / 项目 JSON / 规格清单
 */




function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function safeName(s) {
  return String(s || 'prototype').replace(/[\\/:*?"<>|]+/g, '_').slice(0, 60);
}

/**
 * 把页面渲染成 PNG dataURL（2 倍图）。导出与自测共用。
 */
async function renderPageToDataURL(page) {
  const device = resolveDevice(page);
  const host = renderPage(page, { device });

  host.style.width = device.w + 'px';
  host.style.height = device.h + 'px';
  host.style.background = page.bg || '#ffffff';

  const xml = new XMLSerializer().serializeToString(host);
  const svg =
    '<svg xmlns="http://www.w3.org/2000/svg" width="' + device.w + '" height="' + device.h + '">' +
    '<foreignObject x="0" y="0" width="' + device.w + '" height="' + device.h + '">' +
    '<div xmlns="http://www.w3.org/1999/xhtml">' + xml + '</div>' +
    '</foreignObject></svg>';

  const svgUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);

  const dataUrl = await new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      try {
        const scale = 2;
        const canvas = document.createElement('canvas');
        canvas.width = device.w * scale;
        canvas.height = device.h * scale;
        const g = canvas.getContext('2d');
        g.scale(scale, scale);
        g.fillStyle = page.bg || '#ffffff';
        g.fillRect(0, 0, device.w, device.h);
        g.drawImage(img, 0, 0);
        resolve(canvas.toDataURL('image/png'));
      } catch (e) { reject(e); }
    };
    img.onerror = () => reject(new Error('SVG 转 PNG 失败'));
    img.src = svgUrl;
  });

  return { dataUrl, width: device.w * 2, height: device.h * 2 };
}

/** 批量导出所有页面 PNG（间隔触发，避免浏览器拦截多文件下载） */
async function exportAllPagesPNG(project, onProgress) {
  const pages = project.pages;
  let ok = 0;
  for (let i = 0; i < pages.length; i += 1) {
    const page = pages[i];
    if (onProgress) onProgress(i + 1, pages.length, page.name);
    const { dataUrl } = await renderPageToDataURL(page);
    const base64 = dataUrl.split(',')[1];
    const bin = atob(base64);
    const bytes = new Uint8Array(bin.length);
    for (let k = 0; k < bin.length; k += 1) bytes[k] = bin.charCodeAt(k);
    const name = safeName(project.name + '-' + (i + 1) + '-' + page.name) + '.png';
    downloadBlob(new Blob([bytes], { type: 'image/png' }), name);
    ok += 1;
    await new Promise((r) => setTimeout(r, 420));
  }
  return ok;
}

/** 单独把一个元素渲染成 PNG dataURL（切图用，透明背景） */
async function renderNodeToDataURL(node, scale = 2) {
  const clone = Object.assign({}, node, { x: 0, y: 0, rotation: 0, hidden: false });
  const el = createNodeEl(clone, { interactive: true });
  el.style.left = '0px';
  el.style.top = '0px';

  const wrapper = document.createElement('div');
  wrapper.style.cssText =
    'position:relative;width:' + node.w + 'px;height:' + node.h + 'px;background:transparent;overflow:hidden;';
  wrapper.appendChild(el);

  const xml = new XMLSerializer().serializeToString(wrapper);
  const svg =
    '<svg xmlns="http://www.w3.org/2000/svg" width="' + node.w + '" height="' + node.h + '">' +
    '<foreignObject x="0" y="0" width="' + node.w + '" height="' + node.h + '">' +
    '<div xmlns="http://www.w3.org/1999/xhtml">' + xml + '</div>' +
    '</foreignObject></svg>';

  const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);

  const dataUrl = await new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      try {
        const canvas = document.createElement('canvas');
        canvas.width = Math.max(1, node.w * scale);
        canvas.height = Math.max(1, node.h * scale);
        const g = canvas.getContext('2d');
        g.scale(scale, scale);
        g.drawImage(img, 0, 0);
        resolve(canvas.toDataURL('image/png'));
      } catch (e) { reject(e); }
    };
    img.onerror = () => reject(new Error('元素切图失败'));
    img.src = url;
  });

  return { dataUrl, width: node.w * scale, height: node.h * scale };
}

/** 元素的交付规格文本（标注模式用） */
function buildNodeSpecText(node) {
  const lines = [];
  lines.push('类型：' + typeLabel(node.type));
  lines.push('位置：x=' + node.x + '，y=' + node.y);
  lines.push('尺寸：' + node.w + ' × ' + node.h);
  if (node.radius) lines.push('圆角：' + node.radius + 'px');
  lines.push('填充：' + (node.bg && node.bg !== 'transparent' ? node.bg : '无'));
  if (node.borderWidth) lines.push('描边：' + node.borderWidth + 'px ' + (node.borderColor || '#e5e5e5'));
  if (typeof node.opacity === 'number' && node.opacity !== 1) lines.push('透明度：' + Math.round(node.opacity * 100) + '%');
  if (node.text) {
    lines.push('文字：「' + node.text + '」');
    lines.push('字体：' + (node.fontSize || 16) + 'px / ' + (node.fontWeight >= 700 ? 'bold' : String(node.fontWeight || 400)) + ' / ' + (node.color || '#222222'));
    if (node.lineHeight && node.lineHeight !== 1.4) lines.push('行高：' + node.lineHeight);
    if (node.align && node.align !== 'left') lines.push('对齐：' + node.align);
  }
  if (node.type === 'icon') lines.push('图标：' + (node.icon || 'heart'));
  if (node.type === 'image') lines.push('图片：' + (node.src ? '已上传' : '占位'));
  if (node.type === 'group') lines.push('分组：' + ((node.children && node.children.length) || 0) + ' 个元素');
  if (node.link && node.link.action && node.link.action !== 'none') {
    lines.push('交互：' + (node.link.trigger || 'click') + ' → ' + node.link.action);
  }
  return lines.join('\n');
}

/** 把单个元素导出成切图文件 */
async function exportNodePNG(node, projectName) {
  const { dataUrl } = await renderNodeToDataURL(node);

  const label = (node.text || typeLabel(node.type)).replace(/\s+/g, '_').slice(0, 20);
  downloadBlob(new Blob([bytes], { type: 'image/png' }), safeName(projectName + '-' + label) + '.png');

/**
 * 读入图片文件并压缩成 dataURL（最长边 maxEdge，JPEG 质量 quality）。
 * 压缩是为了让项目 JSON 和 localStorage 别被撑爆。
 */
function compressImageFile(file, maxEdge = 900, quality = 0.82) {
  return new Promise((resolve, reject) => {
    if (!file) { reject(new Error('没有文件')); return; }
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        try {
          const scale = Math.min(1, maxEdge / Math.max(img.width, img.height));
          const w = Math.max(1, Math.round(img.width * scale));
          const h = Math.max(1, Math.round(img.height * scale));
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          const g = canvas.getContext('2d');
          g.drawImage(img, 0, 0, w, h);
          resolve({ dataUrl: canvas.toDataURL('image/jpeg', quality), width: w, height: h, bytes: file.size });
        } catch (e) { reject(e); }
      };
      img.onerror = () => reject(new Error('图片解码失败'));
      img.src = String(reader.result);
    };
    reader.onerror = () => reject(new Error('读取文件失败'));
    reader.readAsDataURL(file);
  });
}

function readProjectFile(file) {  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      try { resolve(JSON.parse(String(reader.result))); } catch (e) { reject(new Error('不是合法的 JSON 项目文件')); }
    };
    reader.onerror = () => reject(new Error('读取文件失败'));
    reader.readAsText(file, 'utf-8');
  });
}

/** 生成人可读的规格清单，可直接贴进作业答案 */
function buildSpecText(page, projectName) {
  const device = resolveDevice(page);
  const lines = [];
  lines.push('【' + (projectName || '原型') + ' · ' + page.name + '】');
  lines.push('画布：' + device.label + '（' + device.w + '×' + device.h + '）');
  lines.push('');

  for (let i = 0; i < page.nodes.length; i += 1) {
    const n = page.nodes[i];
    const parts = [];
    parts.push('位置 (' + n.x + ', ' + n.y + ')');
    parts.push('尺寸 ' + n.w + '×' + n.h);

    if (n.text) parts.push('文字「' + n.text + '」');
    if (['text', 'button', 'input', 'textarea', 'badge', 'listitem', 'navbar', 'image'].indexOf(n.type) >= 0) {
      parts.push('字号 ' + n.fontSize);
      if (n.fontWeight >= 700) parts.push('加粗');
      parts.push('颜色 ' + n.color);
    }
    if (n.bg && n.bg !== 'transparent') parts.push('填充 ' + n.bg);
    if (n.radius) parts.push('圆角 ' + n.radius + 'px');
    if (n.borderWidth) parts.push('描边 ' + n.borderWidth + 'px ' + n.borderColor);
    if (n.type === 'tabbar') parts.push('标签 ' + (n.tabs || []).join('/') + '，选中第 ' + ((n.activeIndex || 0) + 1) + ' 个');
    if (n.type === 'icon') parts.push('图标 ' + n.icon);
    if (n.link && n.link.action && n.link.action !== 'none') {
      if (n.link.action === 'navigate') {
        const t = (page.nodes && null) || null;
        void t;
        parts.push('交互：点击跳转页面');
      } else {
        parts.push('交互：点击' + ({ show: '显示', hide: '隐藏', toggle: '切换' }[n.link.action] || n.link.action));
      }
    }
    lines.push((i + 1) + '. ' + typeLabel(n.type) + '：' + parts.join('，'));
  }

  if (!page.nodes.length) lines.push('（本页还没有元素）');
  return lines.join('\n');
}

function typeLabel(type) {
  const map = {
    text: '文本', rect: '矩形', circle: '圆形', line: '分割线', image: '图片',
    button: '按钮', input: '输入框', textarea: '多行输入框', checkbox: '复选框',
    switch: '开关', icon: '图标', badge: '标签', card: '卡片', listitem: '列表项',
    navbar: '导航栏', tabbar: '标签栏'
  };
  return map[type] || type;
}

/**
 * 导出离线演示 HTML：单文件、含全部页面与交互，双击就能演示，也可以发给别人。
 * 做法：每页用真实渲染器生成静态 DOM（样式已内联），再把触发方式/行为的元数据
 * 写进 data-* 属性，附一段极小运行时。
 */




function escapeAttr(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function nodeHtml(node, overrideStateId) {
  const view = overrideStateId ? Object.assign({}, node, { activeStateId: overrideStateId }) : node;
  const el = createNodeEl(view, { interactive: true });
  el.dataset.id = node.id;
  const link = node.link;
  if (link && link.action && link.action !== 'none') {
    el.dataset.la = link.action;
    el.dataset.t = link.trigger || 'click';
    if (link.targetPageId) el.dataset.lp = link.targetPageId;
    if (link.targetNodeId) el.dataset.ln = link.targetNodeId;
    if (link.targetStateId) el.dataset.ls = link.targetStateId;
    if (link.url) el.dataset.lu = link.url;
    el.style.cursor = 'pointer';
  }
  if (node.type === 'group' && node.overlay) {
    el.dataset.ov = '1';
    if (node.overlayMask) el.dataset.ovm = '1';
    if (node.defaultOpen) el.dataset.ovd = '1';
    el.style.zIndex = '901';
  }
  if (link && link.condition && link.condition.varName) {
    el.dataset.cv = link.condition.varName;
    el.dataset.co = link.condition.op || 'truthy';
    if (link.condition.value != null) el.dataset.cval = String(link.condition.value);
  }
  if (link && link.keyName) el.dataset.lk = String(link.keyName);
  if (link && link.varName) {
    el.dataset.vn = link.varName;
    el.dataset.vv = link.varValue == null ? '' : String(link.varValue);
  }
  return el.outerHTML;
}

function pagePayload(page) {
  const device = resolveDevice(page);
  const nodes = [];
  const overlays = [];
  for (const node of page.nodes) {
    if (node.hidden) continue;
    const item = { id: node.id, html: nodeHtml(node) };
    if (node.states && node.states.length) {
      item.states = {};
      for (const st of node.states) item.states[st.id] = nodeHtml(node, st.id);
      item.active = node.activeStateId || node.states[0].id;
    }
    if (node.type === 'group' && node.overlay) overlays.push(item);
    else nodes.push(item);
  }
  // 浮层放最后，保证层级在最上
  return {
    id: page.id,
    name: page.name,
    w: device.w,
    h: device.h,
    bg: page.bg || '#ffffff',
    nodes: nodes.concat(overlays)
  };
}

const RUNTIME = `
(function () {
  var D = window.__PROTO__;
  var stage = document.getElementById('stage');
  var cur = D.startPageId;
  var pages = {};
  var LP = 500, SW = 30;

  function boot(p) {
    var box = document.createElement('div');
    box.className = 'pg';
    box.dataset.pg = p.id;
    box.style.width = p.w + 'px';
    box.style.height = p.h + 'px';
    box.style.background = p.bg;
    box.style.position = 'relative';
    box.style.overflow = 'hidden';
    pages[p.id] = { data: p, box: box };

    var overlays = [];
    p.nodes.forEach(function (n) {
      var holder = document.createElement('div');
      holder.innerHTML = n.html;
      var el = holder.firstElementChild;
      if (!el) return;
      if (el.dataset.ov === '1') { overlays.push(el); return; }
      box.appendChild(el);
      bind(el, box, p);
    });

    overlays.forEach(function (el) {
      if (el.dataset.ovm === '1') {
        var mask = document.createElement('div');
        mask.className = 'ov-mask';
        mask.dataset.for = el.dataset.id;
        mask.style.cssText = 'position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:900;';
        if (el.dataset.ovd !== '1') mask.style.display = 'none';
        box.appendChild(mask);
      }
      el.style.zIndex = '901';
      if (el.dataset.ovd !== '1') el.style.display = 'none';
      box.appendChild(el);
      bind(el, box, p);
    });

    stage.appendChild(box);
  }

  function bind(el, box, p) {
    var act = el.dataset.la;
    if (!act) return;
    var t = el.dataset.t || 'click';
    el.style.cursor = 'pointer';
    function fire() { run(el, box, p); }

    if (t === 'click') {
      el.addEventListener('click', function (e) { e.stopPropagation(); fire(); });
    } else if (t === 'dblclick') {
      el.addEventListener('dblclick', function (e) { e.stopPropagation(); fire(); });
    } else if (t === 'down') {
      el.addEventListener('pointerdown', function (e) { e.stopPropagation(); fire(); });
    } else if (t === 'up') {
      el.addEventListener('pointerup', function (e) { e.stopPropagation(); fire(); });
    } else if (t === 'contextmenu') {
      el.addEventListener('contextmenu', function (e) { e.preventDefault(); e.stopPropagation(); fire(); });
    } else if (t === 'keydown') {
      var want = el.dataset.lk || 'Enter';
      window.addEventListener('keydown', function (e) { if (e.key === want || e.code === want) fire(); });
    } else if (t === 'shake') {
      window.addEventListener('devicemotion', function (ev) {
        var a = ev.accelerationIncludingGravity || ev.acceleration;
        if (!a) return;
        if (Math.abs(a.x || 0) + Math.abs(a.y || 0) + Math.abs(a.z || 0) > 35) fire();
      });
    } else if (t === 'mouseenter') {
      el.addEventListener('mouseenter', fire);
    } else if (t === 'mouseleave') {
      el.addEventListener('mouseleave', fire);
    } else if (t === 'longpress') {
      var timer = null;
      var clear = function () { if (timer) { clearTimeout(timer); timer = null; } };
      el.addEventListener('pointerdown', function (e) {
        e.stopPropagation(); clear();
        timer = setTimeout(function () { timer = null; fire(); }, LP);
      });
      el.addEventListener('pointerup', clear);
      el.addEventListener('pointerleave', clear);
    } else if (t.indexOf('swipe') === 0) {
      var sx = 0, sy = 0, tracking = false;
      el.addEventListener('pointerdown', function (e) {
        e.stopPropagation(); sx = e.clientX; sy = e.clientY; tracking = true;
      });
      el.addEventListener('pointerup', function (e) {
        if (!tracking) return;
        tracking = false;
        var dx = e.clientX - sx, dy = e.clientY - sy;
        var horiz = Math.abs(dx) > Math.abs(dy);
        var dist = horiz ? Math.abs(dx) : Math.abs(dy);
        if (dist < SW) return;
        var dir = horiz ? (dx > 0 ? 'Right' : 'Left') : (dy > 0 ? 'Down' : 'Up');
        if ('swipe' + dir === t) fire();
      });
    }
  }

  var vars = {};
  (D.variables || []).forEach(function (v) { vars[v.name] = String(v.value == null ? '' : v.value); });

  function checkCond(el) {
    var vn = el.dataset.cv;
    if (!vn) return true;
    var actual = Object.prototype.hasOwnProperty.call(vars, vn) ? vars[vn] : '';
    var op = el.dataset.co || 'truthy';
    var expect = el.dataset.cval == null ? '' : el.dataset.cval;
    if (op === 'truthy') return actual !== '' && actual !== '0' && actual !== 'false';
    if (op === 'falsy') return actual === '' || actual === '0' || actual === 'false';
    if (op === 'neq') return actual !== expect;
    return actual === expect;
  }

  function run(el, box, p) {
    var act = el.dataset.la;
    if (!checkCond(el)) return;
    if (act === 'setVar') {
      if (el.dataset.vn) vars[el.dataset.vn] = (el.dataset.vv == null ? '' : el.dataset.vv);
      runWatchers(box, p);
      return;
    }
    if (act === 'navigate' && el.dataset.lp) { show(el.dataset.lp); return; }
    if (act === 'url' && el.dataset.lu) { window.open(el.dataset.lu, '_blank', 'noopener'); return; }

    var nodeId = el.dataset.ln;
    if (!nodeId) return;
    var target = box.querySelector('[data-id="' + nodeId + '"]');
    if (!target) return;

    if (act === 'state') {
      var nd = null;
      for (var i = 0; i < p.nodes.length; i++) if (p.nodes[i].id === nodeId) nd = p.nodes[i];
      if (!nd || !nd.states) return;
      var nextId = el.dataset.ls;
      if (!nextId) {
        var curId = target.dataset.state || nd.active;
        var ids = Object.keys(nd.states);
        var idx = ids.indexOf(curId);
        nextId = ids[(idx + 1) % ids.length];
      }
      var holder = document.createElement('div');
      holder.innerHTML = nd.states[nextId];
      var fresh = holder.firstElementChild;
      if (!fresh) return;
      fresh.dataset.state = nextId;
      target.replaceWith(fresh);
      bind(fresh, box, p);
      return;
    }

    if (act === 'show') target.style.display = '';
    else if (act === 'hide') target.style.display = 'none';
    else if (act === 'toggle') target.style.display = (target.style.display === 'none' ? '' : 'none');
    else if (act === 'openOverlay' || act === 'closeOverlay') {
      var showOv = (act === 'openOverlay');
      target.style.display = showOv ? '' : 'none';
      var ovMask = box.querySelector('.ov-mask[data-for="' + nodeId + '"]');
      if (ovMask) ovMask.style.display = showOv ? '' : 'none';
    }
    else if (act === 'scrollTo' && target.scrollIntoView) target.scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  function runWatchers(box, p) {
    var list = box.querySelectorAll('[data-t="watch"]');
    Array.prototype.forEach.call(list, function (el) {
      if (checkCond(el)) run(el, box, p);
    });
  }

  function show(id) {
    cur = id;
    Object.keys(pages).forEach(function (k) {
      pages[k].box.style.display = (k === id ? 'block' : 'none');

    var loads = p.box.querySelectorAll('[data-t="load"]');
    if (loads.length) {
      setTimeout(function () {
        Array.prototype.forEach.call(loads, function (el) { run(el, p.box, p.data); });
      }, 60);
    }
  }

  function fit() {
    var p = pages[cur];
    if (!p) return;
    var pad = 48;
    var s = Math.min(1, (window.innerWidth - pad) / p.data.w, (window.innerHeight - pad) / p.data.h);
    stage.style.transform = 'scale(' + s + ')';
  }

  window.addEventListener('resize', fit);

  D.pages.forEach(boot);
  show(D.startPageId);
})();
`;

function buildStandaloneHtml(project) {
  const pages = project.pages.map(pagePayload);
  const data = {
    name: project.name || '原型',
    startPageId: project.activePageId || (pages[0] && pages[0].id),
    variables: (project.variables || []).map((v) => ({ name: v.name, value: v.value })),

/* ===== src/pdf.js ===== */
/**
 * 无依赖 PDF 导出：每页渲染成 JPEG，嵌进最小 PDF 结构（DCTDecode）。
 * 不引入任何库，生成的就是标准 PDF，可直接打印或发给别人。
 */




const PT_PER_PX = 0.75; // 96dpi → 72dpi

function b64ToBytes(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i += 1) out[i] = bin.charCodeAt(i);
  return out;
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('图片解码失败'));
    img.src = src;
  });
}

async function pageToJpeg(page) {
  const { dataUrl } = await renderPageToDataURL(page);
  const img = await loadImage(dataUrl);
  const canvas = document.createElement('canvas');
  canvas.width = img.width;
  canvas.height = img.height;
  const g = canvas.getContext('2d');
  g.fillStyle = page.bg || '#ffffff';
  g.fillRect(0, 0, canvas.width, canvas.height);
  g.drawImage(img, 0, 0);
  const jpeg = canvas.toDataURL('image/jpeg', 0.92);
  return {
    bytes: b64ToBytes(jpeg.split(',')[1]),
    pxW: img.width,
    pxH: img.height
  };
}

function assemblePDF(pages, title) {
  const enc = new TextEncoder();
  const chunks = [];
  const offsets = [];
  let offset = 0;

  function push(data) {
    const u8 = typeof data === 'string' ? enc.encode(data) : data;
    chunks.push(u8);
    offset += u8.length;
  }

  function obj(n, body) {
    offsets[n] = offset;
    push(n + ' 0 obj\n');
    push(body);
    push('\nendobj\n');
  }

  // 头部 + 二进制标记注释
  push('%PDF-1.4\n');
  push(new Uint8Array([0x25, 0xe2, 0xe3, 0xcf, 0xd3, 0x0a]));

  const count = pages.length;
  const kids = [];
  for (let i = 0; i < count; i += 1) kids.push((3 + i * 3) + ' 0 R');

  obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
  obj(2, '<< /Type /Pages /Kids [' + kids.join(' ') + '] /Count ' + count + ' >>');

  for (let i = 0; i < count; i += 1) {
    const p = pages[i];
    const pageNum = 3 + i * 3;
    const contentNum = pageNum + 1;
    const imgNum = pageNum + 2;
    const w = (p.ptW).toFixed(2);
    const h = (p.ptH).toFixed(2);

    obj(pageNum, '<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ' + w + ' ' + h +
      '] /Resources << /XObject << /Im0 ' + imgNum + ' 0 R >> >> /Contents ' + contentNum + ' 0 R >>');

    const content = 'q\n' + w + ' 0 0 ' + h + ' 0 0 cm\n/Im0 Do\nQ\n';
    const contentBytes = enc.encode(content);
    obj(contentNum, '<< /Length ' + contentBytes.length + ' >>\nstream\n' + content + 'endstream');

    // 图像对象要把 header 和二进制分开推
    offsets[imgNum] = offset;
    push(imgNum + ' 0 obj\n');
    push('<< /Type /XObject /Subtype /Image /Width ' + p.pxW + ' /Height ' + p.pxH +
      ' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ' + p.jpg.length + ' >>\nstream\n');
    push(p.jpg);
    push('\nendstream\nendobj\n');
  }

  // 文档信息
  const infoNum = 3 + count * 3;
  const safeTitle = String(title || 'prototype').replace(/[\\()]/g, ' ');
  obj(infoNum, '<< /Title (' + safeTitle + ') /Producer (modao-open) >>');

  const totalObjects = infoNum;
  const xrefStart = offset;

  let xref = 'xref\n0 ' + (totalObjects + 1) + '\n';
  xref += '0000000000 65535 f \n';
  for (let n = 1; n <= totalObjects; n += 1) {
    const off = String(offsets[n] || 0).padStart(10, '0');
    xref += off + ' 00000 n \n';
  }
  push(xref);

  push('trailer\n<< /Size ' + (totalObjects + 1) + ' /Root 1 0 R /Info ' + infoNum + ' 0 R >>\n');
  push('startxref\n' + xrefStart + '\n%%EOF\n');

  let total = 0;
  for (const c of chunks) total += c.length;
  const out = new Uint8Array(total);
  let cursor = 0;
  for (const c of chunks) {
    out.set(c, cursor);
    cursor += c.length;
  }
  return out;
}

async function buildProjectPDF(project, onProgress) {
  const pages = [];
  for (let i = 0; i < project.pages.length; i += 1) {
    const page = project.pages[i];
    if (onProgress) onProgress(i + 1, project.pages.length, page.name);
    const dev = resolveDevice(page);
    const jpg = await pageToJpeg(page);
    pages.push({
      jpg: jpg.bytes,
      pxW: jpg.pxW,
      pxH: jpg.pxH,
      ptW: dev.w * PT_PER_PX,
      ptH: dev.h * PT_PER_PX
    });
    await new Promise((r) => setTimeout(r, 40));
  }
  return assemblePDF(pages, project.name);
}

async function downloadProjectPDF(project, onProgress) {
  const bytes = await buildProjectPDF(project, onProgress);
  const blob = new Blob([bytes], { type: 'application/pdf' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = String(project.name || 'prototype').replace(/[\\/:*?"<>|]+/g, '_') + '.pdf';
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  return bytes.length;
}

/**
 * AI 生成（BYO API Key）：OpenAI 兼容 /chat/completions
 * Key 只存本机 localStorage，直接发给你配置的接口，不经过任何第三方。
 */



const SETTINGS_KEY = 'modao-open:ai-settings:v1';

const DEFAULT_SETTINGS = {
  baseURL: 'https://api.deepseek.com/v1',
  apiKey: '',
  model: 'deepseek-chat',
  temperature: 0.6
};

function loadAISettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (!raw) return Object.assign({}, DEFAULT_SETTINGS);
    return Object.assign({}, DEFAULT_SETTINGS, JSON.parse(raw));
  } catch (e) {
    return Object.assign({}, DEFAULT_SETTINGS);
  }
}

function saveAISettings(s) {
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(s));
}

function extractJSON(text) {
  if (!text) throw new Error('模型没有返回内容');
  const fenced = text.match(/```(?:json)?\s*([\s\S]*?)```/i);
  const body = fenced ? fenced[1] : text;
  const start = body.indexOf('{');
  const end = body.lastIndexOf('}');
  if (start < 0 || end <= start) throw new Error('返回内容里找不到 JSON');
  return JSON.parse(body.slice(start, end + 1));
}

function systemPrompt(device) {
  return [
    '你是一个移动端原型设计助手。你只输出 JSON，不要解释。',
    '输出格式：{"name":"页面名","nodes":[{"type":"text|rect|circle|line|image|button|input|textarea|checkbox|switch|icon|badge|card|listitem|navbar|tabbar","text":"文案","x":0,"y":0,"w":320,"h":44,"fontSize":16,"fontWeight":400,"color":"#222222","bg":"#1677ff","radius":8,"align":"center"}]}',
    '画布是 ' + device.w + '×' + device.h + ' 逻辑像素。x/y 是元素左上角坐标，别超出画布。',
    '规则：相邻元素留 8~24px 间距；标题 18~28 号加粗；正文 14~16 号；按钮高 44，圆角 8，主色 #1677ff，文字白色；占位文字颜色 #bbbbbb；分割线用 line 且 h=1。',
    '只输出 JSON。'
  ].join('\n');
}

async function generatePage(prompt, settings, device, signal) {
  if (!settings.apiKey) throw new Error('还没有填 API Key');
  if (!settings.baseURL) throw new Error('还没有填接口地址');

  const url = settings.baseURL.replace(/\/+$/, '') + '/chat/completions';
  const body = {
    model: settings.model,
    temperature: settings.temperature == null ? 0.6 : settings.temperature,
    messages: [
      { role: 'system', content: systemPrompt(device) },
      { role: 'user', content: prompt }
    ]
  };

  const res = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      Authorization: 'Bearer ' + settings.apiKey
    },
    body: JSON.stringify(body),
    signal
  });

  if (!res.ok) {
    let detail = '';
    try { detail = (await res.text()).slice(0, 300); } catch (e) { detail = ''; }
    throw new Error('接口返回 ' + res.status + '：' + detail);
  }

  const data = await res.json();
  const content = data && data.choices && data.choices[0] && data.choices[0].message
    ? data.choices[0].message.content
    : (data && data.content) || '';
  const parsed = extractJSON(content);
  return normalizeGenerated(parsed, device);
}

function normalizeGenerated(parsed, device) {
  const nodes = Array.isArray(parsed.nodes) ? parsed.nodes : [];
  const out = [];
  for (const raw of nodes) {
    const type = getComponent(raw.type).type;
    const patch = {};
    const allowed = ['x', 'y', 'w', 'h', 'text', 'fontSize', 'fontWeight', 'color', 'bg', 'radius',
      'align', 'lineHeight', 'paddingX', 'borderWidth', 'borderColor', 'shadow', 'verticalAlign',
      'icon', 'tabs', 'activeIndex', 'checked', 'on', 'divider'];
    for (const k of allowed) if (raw[k] !== undefined) patch[k] = raw[k];
    if (patch.x === undefined) patch.x = 16;
    if (patch.y === undefined) patch.y = 80;
    patch.x = clamp(Number(patch.x) || 0, -40, device.w);
    patch.y = clamp(Number(patch.y) || 0, -40, device.h);
    if (patch.w !== undefined) patch.w = Math.max(4, Number(patch.w) || 100);
    if (patch.h !== undefined) patch.h = Math.max(1, Number(patch.h) || 40);
    out.push(createNode(type, device, patch));
  }
  return { name: parsed.name || 'AI 页面', nodes: out };
}

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

/** AI 面板 UI（在 modal 里渲染） */

  const settings = loadAISettings();

  container.appendChild(prompt);

  const status = document.createElement('div');
  status.className = 'hint';
  status.style.marginTop = '8px';
  container.appendChild(status);

  return {
    getPrompt() { return prompt.value; },
    getSettings() {
      const s = {
        baseURL: baseURL.value.trim(),
        model: model.value.trim(),

    },
    setStatus(text, isError) {
      status.textContent = text;
      status.style.color = isError ? '#ff9b9d' : 'var(--text-dim)';
    }
  };
}

  if (body) modalBody.appendChild(body);
  const foot = buildFoot ? buildFoot() : null;
  if (foot) modalFoot.appendChild(foot);
  modal.hidden = false;
  return {
    close() { modal.hidden = true; if (modalCleanup) { modalCleanup(); modalCleanup = null; } }
  };
}

function closeModal() {
  modal.hidden = true;
  if (modalCleanup) { modalCleanup(); modalCleanup = null; }
}

$('modalClose').addEventListener('click', closeModal);
modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });

function btn(label, onClick, cls) {
  const b = document.createElement('button');

function renderAll(reason) {

function fillDeviceSelect() {

    const o = document.createElement('option');

document.getElementById('toolbar').addEventListener('click', (e) => {
  const t = e.target;
  if (!t.dataset || !t.dataset.act) return;
  const act = t.dataset.act;
  if (act === 'undo') { if (!store.undo()) toast('没有可撤销的操作'); }
  else if (act === 'redo') { if (!store.redo()) toast('没有可重做的操作'); }
  else if (act === 'zoom-in') store.setZoom(store.state.zoom + 0.1);
  else if (act === 'zoom-out') store.setZoom(store.state.zoom - 0.1);
  else if (act === 'zoom-fit') canvas.fit();
  else if (act === 'toggle-grid') store.toggleGrid();
  else if (act === 'toggle-links') store.toggleLinks();
  else if (act === 'inspect') store.toggleInspect();
  else if (act === 'theme') cycleTheme();
});

document.querySelector('.right-actions').addEventListener('click', async (e) => {
  const t = e.target;
  if (!t.dataset || !t.dataset.act) return;
  const act = t.dataset.act;

  if (act === 'preview') return openPreview();
  if (act === 'spec') return openSpec();
  if (act === 'export') return openExportMenu();
  if (act === 'open') {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json,application/json';
    input.addEventListener('change', async () => {
      const file = input.files && input.files[0];
      if (!file) return;
      try {
        const raw = await readProjectFile(file);
        store.loadProject(raw);
        renderAll('restore');
        toast('已打开：' + store.project.name);
      } catch (err) {
        toast(err.message);
      }
    });
    input.click();
    return;
  }
  if (act === 'ai') return openAI();
  if (act === 'preset') {
    loadAssignmentPreset();
    return;
  }
});
