/**
 * 交互连线（画面上的可视化）与预览运行时
 */



const SVG_NS = 'http://www.w3.org/2000/svg';

function renderLinks(layer, store) {
  layer.textContent = '';
  if (!store.state.showLinks) return;

  const page = store.page;
  const device = store.device;
  const svg = document.createElementNS(SVG_NS, 'svg');
  svg.setAttribute('width', String(device.w));
  svg.setAttribute('height', String(device.h));
  svg.style.position = 'absolute';
  svg.style.inset = '0';
  svg.style.overflow = 'visible';

  let count = 0;

  for (const node of page.nodes) {
    if (!node.link || !node.link.action || node.link.action === 'none') continue;
    const from = { x: node.x + node.w, y: node.y + node.h / 2 };

    let to = null;
    let label = '';

    if (node.link.action === 'navigate') {
      const target = store.project.pages.find((p) => p.id === node.link.targetPageId);
      if (!target) continue;
      to = { x: device.w - 10, y: from.y };
      label = '→ ' + target.name;
    } else if (node.link.action === 'state') {
      const target = page.nodes.find((n) => n.id === node.link.targetNodeId);
      if (!target) continue;
      to = { x: target.x + target.w / 2, y: target.y + target.h / 2 };
      let stName = '下一个状态';
      if (node.link.targetStateId && target.states) {
        const st = target.states.find((s) => s.id === node.link.targetStateId);
        if (st) stName = st.name;
      }
      label = '切状态 → ' + stName;
    } else {
      const target = page.nodes.find((n) => n.id === node.link.targetNodeId);
      if (!target) continue;
      to = { x: target.x + target.w / 2, y: target.y + target.h / 2 };
      label = node.link.action === 'show' ? '显示' : (node.link.action === 'hide' ? '隐藏' : '切换');
    }

    const path = document.createElementNS(SVG_NS, 'path');
    const dx = Math.max(24, Math.abs(to.x - from.x) * 0.45);
    const d = 'M ' + from.x + ' ' + from.y +
      ' C ' + (from.x + dx) + ' ' + from.y + ', ' + (to.x - dx) + ' ' + to.y + ', ' + to.x + ' ' + to.y;
    path.setAttribute('d', d);
    path.setAttribute('class', 'link-path');
    svg.appendChild(path);

    const circle = document.createElementNS(SVG_NS, 'circle');
    circle.setAttribute('cx', String(from.x));
    circle.setAttribute('cy', String(from.y));
    circle.setAttribute('r', '3');
    circle.setAttribute('fill', '#1677ff');
    svg.appendChild(circle);

    const text = document.createElementNS(SVG_NS, 'text');
    text.setAttribute('x', String(node.link.action === 'navigate' ? Math.max(8, to.x - 96) : to.x + 6));
    text.setAttribute('y', String(to.y - 6));
    text.setAttribute('fill', '#1677ff');
    text.setAttribute('stroke', 'rgba(255,255,255,0.92)');
    text.setAttribute('stroke-width', '3');
    text.setAttribute('paint-order', 'stroke');
    text.setAttribute('font-size', '10');
    text.setAttribute('font-family', 'Microsoft YaHei, sans-serif');
    text.textContent = label;
    svg.appendChild(text);

    count += 1;
  }

  layer.appendChild(svg);
  layer.dataset.count = String(count);
}

/**
 * 预览运行时：页面跳转、显隐切换、组件状态切换。
 * project 传进来的应是深拷贝，运行时允许改动其 activeStateId。
 */
function createPreviewRuntime(project, startPageId, mount) {
  let currentPageId = startPageId;
  const hiddenState = new Map();

  function pageById(id) {
    return project.pages.find((p) => p.id === id) || project.pages[0];
  }

  function render() {
    const page = pageById(currentPageId);
    mount.textContent = '';

    const dev = page.device || { w: 402, h: 874 };
    const host = document.createElement('div');
    host.style.position = 'relative';
    host.style.width = dev.w + 'px';
    host.style.height = dev.h + 'px';
    host.style.background = page.bg || '#ffffff';
    host.style.overflow = 'hidden';

    const nodeEls = new Map();

    function bind(node, el) {
      el.style.cursor = node.link ? 'pointer' : 'default';
      el.addEventListener('click', (ev) => {
        ev.stopPropagation();
        runLink(node);
      });
    }

    function rerenderNode(node) {
      const old = nodeEls.get(node.id);
      if (!old) return;
      const fresh = createNodeEl(node, { interactive: true });
      if (hiddenState.get(node.id) === true) fresh.style.display = 'none';
      bind(node, fresh);
      old.replaceWith(fresh);
      nodeEls.set(node.id, fresh);
    }

    function runLink(node) {
      const link = node.link;
      if (!link || !link.action || link.action === 'none') return;

      if (link.action === 'navigate') {
        if (link.targetPageId && link.targetPageId !== page.id) {
          currentPageId = link.targetPageId;
          hiddenState.clear();
          render();
        }
        return;
      }

      const target = page.nodes.find((n) => n.id === link.targetNodeId);
      if (!target) return;

      if (link.action === 'state') {
        if (!target.states || !target.states.length) return;
        if (link.targetStateId) {
          target.activeStateId = link.targetStateId;
        } else {
          const idx = target.states.findIndex((s) => s.id === target.activeStateId);
          const next = target.states[(idx + 1) % target.states.length];
          target.activeStateId = next.id;
        }
        rerenderNode(target);
        return;
      }

      const el = nodeEls.get(target.id);
      if (!el) return;

      if (link.action === 'show') {
        el.style.display = '';
        hiddenState.set(target.id, false);
      } else if (link.action === 'hide') {
        el.style.display = 'none';
        hiddenState.set(target.id, true);
      } else if (link.action === 'toggle') {
        const isHidden = el.style.display === 'none';
        el.style.display = isHidden ? '' : 'none';
        hiddenState.set(target.id, !isHidden);
      }
    }

    for (const node of page.nodes) {
      if (node.hidden) continue;
      const el = createNodeEl(node, { interactive: true });
      if (hiddenState.get(node.id) === true) el.style.display = 'none';
      bind(node, el);
      host.appendChild(el);
      nodeEls.set(node.id, el);
    }

    mount.appendChild(host);
  }

  return {
    start() { render(); },
    restart() {
      currentPageId = startPageId;
      hiddenState.clear();
      render();
    },
    currentPage() { return pageById(currentPageId); }
  };
}

/**
 * 导入导出：PNG / 项目 JSON / 规格清单
 */




function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

function safeName(s) {
  return String(s || 'prototype').replace(/[\\/:*?"<>|]+/g, '_').slice(0, 60);
}

/**
 * 把页面渲染成 PNG dataURL（2 倍图）。导出与自测共用。
 */
async function renderPageToDataURL(page) {
  const device = getDevice(page.deviceId);
  const host = renderPage(page, { device });

  host.style.width = device.w + 'px';
  host.style.height = device.h + 'px';
  host.style.background = page.bg || '#ffffff';

  const xml = new XMLSerializer().serializeToString(host);
  const svg =
    '<svg xmlns="http://www.w3.org/2000/svg" width="' + device.w + '" height="' + device.h + '">' +
    '<foreignObject x="0" y="0" width="' + device.w + '" height="' + device.h + '">' +
    '<div xmlns="http://www.w3.org/1999/xhtml">' + xml + '</div>' +
    '</foreignObject></svg>';

  const svgUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);

  const dataUrl = await new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      try {
        const scale = 2;
        const canvas = document.createElement('canvas');
        canvas.width = device.w * scale;
        canvas.height = device.h * scale;
        const g = canvas.getContext('2d');
        g.scale(scale, scale);
        g.fillStyle = page.bg || '#ffffff';
        g.fillRect(0, 0, device.w, device.h);
        g.drawImage(img, 0, 0);
        resolve(canvas.toDataURL('image/png'));
      } catch (e) { reject(e); }
    };
    img.onerror = () => reject(new Error('SVG 转 PNG 失败'));
    img.src = svgUrl;
  });

  return { dataUrl, width: device.w * 2, height: device.h * 2 };
}

/** 批量导出所有页面 PNG（间隔触发，避免浏览器拦截多文件下载） */
async function exportAllPagesPNG(project, onProgress) {
  const pages = project.pages;
  let ok = 0;
  for (let i = 0; i < pages.length; i += 1) {
    const page = pages[i];
    if (onProgress) onProgress(i + 1, pages.length, page.name);
    const { dataUrl } = await renderPageToDataURL(page);
    const base64 = dataUrl.split(',')[1];
    const bin = atob(base64);
    const bytes = new Uint8Array(bin.length);
    for (let k = 0; k < bin.length; k += 1) bytes[k] = bin.charCodeAt(k);
    const name = safeName(project.name + '-' + (i + 1) + '-' + page.name) + '.png';
    downloadBlob(new Blob([bytes], { type: 'image/png' }), name);
    ok += 1;
    await new Promise((r) => setTimeout(r, 420));
  }
  return ok;
}

/** 把页面导出成 PNG 文件 */
async function exportPagePNG(page, projectName) {
  const { dataUrl } = await renderPageToDataURL(page);
  const base64 = dataUrl.split(',')[1];
  const bin = atob(base64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i += 1) bytes[i] = bin.charCodeAt(i);
  downloadBlob(new Blob([bytes], { type: 'image/png' }), safeName(projectName + '-' + page.name) + '.png');
}

function exportProjectJSON(project) {
  const text = JSON.stringify(project, null, 2);
  downloadBlob(new Blob([text], { type: 'application/json' }), safeName(project.name) + '.modao.json');
}

function readProjectFile(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      try { resolve(JSON.parse(String(reader.result))); } catch (e) { reject(new Error('不是合法的 JSON 项目文件')); }

/** 生成人可读的规格清单，可直接贴进作业答案 */
function buildSpecText(page, projectName) {
  const device = getDevice(page.deviceId);
  const lines = [];
  lines.push('【' + (projectName || '原型') + ' · ' + page.name + '】');
  lines.push('画布：' + device.label + '（' + device.w + '×' + device.h + '）');
  lines.push('');

  for (let i = 0; i < page.nodes.length; i += 1) {
    const n = page.nodes[i];
    const parts = [];
    parts.push('位置 (' + n.x + ', ' + n.y + ')');
    parts.push('尺寸 ' + n.w + '×' + n.h);

    if (n.text) parts.push('文字「' + n.text + '」');
    if (['text', 'button', 'input', 'textarea', 'badge', 'listitem', 'navbar', 'image'].indexOf(n.type) >= 0) {
      parts.push('字号 ' + n.fontSize);
      if (n.fontWeight >= 700) parts.push('加粗');
      parts.push('颜色 ' + n.color);
    }
    if (n.bg && n.bg !== 'transparent') parts.push('填充 ' + n.bg);
    if (n.radius) parts.push('圆角 ' + n.radius + 'px');
    if (n.borderWidth) parts.push('描边 ' + n.borderWidth + 'px ' + n.borderColor);
    if (n.type === 'tabbar') parts.push('标签 ' + (n.tabs || []).join('/') + '，选中第 ' + ((n.activeIndex || 0) + 1) + ' 个');
    if (n.type === 'icon') parts.push('图标 ' + n.icon);
    if (n.link && n.link.action && n.link.action !== 'none') {
      if (n.link.action === 'navigate') {
        const t = (page.nodes && null) || null;
        void t;
        parts.push('交互：点击跳转页面');
      } else {
        parts.push('交互：点击' + ({ show: '显示', hide: '隐藏', toggle: '切换' }[n.link.action] || n.link.action));
      }
    }
    lines.push((i + 1) + '. ' + typeLabel(n.type) + '：' + parts.join('，'));

  if (!page.nodes.length) lines.push('（本页还没有元素）');
  return lines.join('\n');

    button: '按钮', input: '输入框', textarea: '多行输入框', checkbox: '复选框',
    switch: '开关', icon: '图标', badge: '标签', card: '卡片', listitem: '列表项',
    navbar: '导航栏', tabbar: '标签栏'

  return map[type] || type;
}

/**
 * 导出离线演示 HTML：单文件、含全部页面与交互，双击就能演示，也可以发给别人。
 * 做法：每页用真实渲染器生成静态 DOM（样式已内联），再把跳转/显隐/状态切换的元数据
 * 写进 data-* 属性，附一段极小运行时。
 */




function escapeAttr(v) {
  return String(v == null ? '' : v)
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
}

function nodeHtml(node, overrideStateId) {
  const view = overrideStateId ? Object.assign({}, node, { activeStateId: overrideStateId }) : node;
  const el = createNodeEl(view, { interactive: true });
  el.dataset.id = node.id;
  const link = node.link;
  if (link && link.action && link.action !== 'none') {
    el.dataset.la = link.action;
    if (link.targetPageId) el.dataset.lp = link.targetPageId;
    if (link.targetNodeId) el.dataset.ln = link.targetNodeId;
    if (link.targetStateId) el.dataset.ls = link.targetStateId;
    el.style.cursor = 'pointer';
  }
  return el.outerHTML;
}

function pagePayload(page) {
  const device = getDevice(page.deviceId);
  const nodes = [];
  for (const node of page.nodes) {
    if (node.hidden) continue;
    const item = { id: node.id, html: nodeHtml(node) };
    if (node.states && node.states.length) {
      item.states = {};
      for (const st of node.states) item.states[st.id] = nodeHtml(node, st.id);
      item.active = node.activeStateId || node.states[0].id;
    }
    nodes.push(item);
  }
  return {
    id: page.id,
    name: page.name,
    w: device.w,
    h: device.h,
    bg: page.bg || '#ffffff',
    nodes
  };
}

const RUNTIME = `
(function () {
  var D = window.__PROTO__;
  var stage = document.getElementById('stage');
  var cur = D.startPageId;
  var pages = {};
  D.pages.forEach(function (p) {
    var box = document.createElement('div');
    box.className = 'pg';
    box.dataset.pg = p.id;
    box.style.width = p.w + 'px';
    box.style.height = p.h + 'px';
    box.style.background = p.bg;
    box.style.position = 'relative';
    box.style.overflow = 'hidden';
    pages[p.id] = p;
    p.nodes.forEach(function (n) {
      var holder = document.createElement('div');
      holder.innerHTML = n.html;
      var el = holder.firstElementChild;
      if (el) box.appendChild(el);
    });
    stage.appendChild(box);
  });

  function show(id) {
    cur = id;
    Array.prototype.forEach.call(stage.children, function (box) {
      box.style.display = box.dataset.pg === id ? 'block' : 'none';
    });
    fit();
  }

  function fit() {
    var p = pages[cur];
    if (!p) return;
    var pad = 48;
    var s = Math.min(1, (window.innerWidth - pad) / p.w, (window.innerHeight - pad) / p.h);
    stage.style.transform = 'scale(' + s + ')';
  }

  window.addEventListener('resize', fit);

  stage.addEventListener('click', function (e) {
    var el = e.target;
    while (el && el !== stage && !(el.dataset && el.dataset.la)) el = el.parentElement;
    if (!el || !el.dataset || !el.dataset.la) return;
    var act = el.dataset.la;
    if (act === 'navigate' && el.dataset.lp) { show(el.dataset.lp); return; }
    var lp = el.closest ? el.closest('.pg') : null;
    if (!lp) return;
    if (act === 'state') {
      var nodeId = el.dataset.ln;
      var target = lp.querySelector('[data-id="' + nodeId + '"]');
      if (!target) return;
      var p = pages[lp.dataset.pg];
      var nd = null;
      for (var i = 0; i < p.nodes.length; i++) if (p.nodes[i].id === nodeId) nd = p.nodes[i];
      if (!nd || !nd.states) return;
      var nextId = el.dataset.ls;
      if (!nextId) {
        var curId = target.dataset.state || nd.active;
        var ids = Object.keys(nd.states);
        var idx = ids.indexOf(curId);
        nextId = ids[(idx + 1) % ids.length];
      }
      var holder = document.createElement('div');
      holder.innerHTML = nd.states[nextId];
      var fresh = holder.firstElementChild;
      if (!fresh) return;
      fresh.dataset.state = nextId;
      target.replaceWith(fresh);
      return;
    }
    var nodeId2 = el.dataset.ln;
    var t2 = lp.querySelector('[data-id="' + nodeId2 + '"]');
    if (!t2) return;
    if (act === 'show') t2.style.display = '';
    else if (act === 'hide') t2.style.display = 'none';
    else if (act === 'toggle') t2.style.display = (t2.style.display === 'none' ? '' : 'none');
  });

  show(D.startPageId);
})();
`;

/**

 * Key 只存本机 localStorage，直接发给你配置的接口，不经过任何第三方。

const SETTINGS_KEY = 'modao-open:ai-settings:v1';

  baseURL: 'https://api.deepseek.com/v1',
  apiKey: '',
  model: 'deepseek-chat',

function loadAISettings() {
  try {

    if (!raw) return Object.assign({}, DEFAULT_SETTINGS);
    return Object.assign({}, DEFAULT_SETTINGS, JSON.parse(raw));

    return Object.assign({}, DEFAULT_SETTINGS);

function saveAISettings(s) {
  localStorage.setItem(SETTINGS_KEY, JSON.stringify(s));
}

function extractJSON(text) {
  if (!text) throw new Error('模型没有返回内容');
  const fenced = text.match(/```(?:json)?\s*([\s\S]*?)```/i);
  const body = fenced ? fenced[1] : text;
  const start = body.indexOf('{');
  const end = body.lastIndexOf('}');
  if (start < 0 || end <= start) throw new Error('返回内容里找不到 JSON');
  return JSON.parse(body.slice(start, end + 1));
}

    '画布是 ' + device.w + '×' + device.h + ' 逻辑像素。x/y 是元素左上角坐标，别超出画布。',
    '规则：相邻元素留 8~24px 间距；标题 18~28 号加粗；正文 14~16 号；按钮高 44，圆角 8，主色 #1677ff，文字白色；占位文字颜色 #bbbbbb；分割线用 line 且 h=1。',
    '只输出 JSON。'
  ].join('\n');
}

async function generatePage(prompt, settings, device, signal) {
  if (!settings.apiKey) throw new Error('还没有填 API Key');
  if (!settings.baseURL) throw new Error('还没有填接口地址');

  const url = settings.baseURL.replace(/\/+$/, '') + '/chat/completions';
  const body = {
    model: settings.model,
    temperature: settings.temperature == null ? 0.6 : settings.temperature,
    messages: [
      { role: 'system', content: systemPrompt(device) },
      { role: 'user', content: prompt }
    ]
  };

  const res = await fetch(url, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      Authorization: 'Bearer ' + settings.apiKey
    },
    body: JSON.stringify(body),
    signal
  });

  if (!res.ok) {
    let detail = '';
    try { detail = (await res.text()).slice(0, 300); } catch (e) { detail = ''; }
    throw new Error('接口返回 ' + res.status + '：' + detail);
  }

  const data = await res.json();
  const content = data && data.choices && data.choices[0] && data.choices[0].message
    ? data.choices[0].message.content
    : (data && data.content) || '';
  const parsed = extractJSON(content);
  return normalizeGenerated(parsed, device);
}

function normalizeGenerated(parsed, device) {
  const nodes = Array.isArray(parsed.nodes) ? parsed.nodes : [];
  const out = [];
  for (const raw of nodes) {
    const type = getComponent(raw.type).type;
    const patch = {};
    const allowed = ['x', 'y', 'w', 'h', 'text', 'fontSize', 'fontWeight', 'color', 'bg', 'radius',
      'align', 'lineHeight', 'paddingX', 'borderWidth', 'borderColor', 'shadow', 'verticalAlign',
      'icon', 'tabs', 'activeIndex', 'checked', 'on', 'divider'];
    for (const k of allowed) if (raw[k] !== undefined) patch[k] = raw[k];
    if (patch.x === undefined) patch.x = 16;
    if (patch.y === undefined) patch.y = 80;
    patch.x = clamp(Number(patch.x) || 0, -40, device.w);
    patch.y = clamp(Number(patch.y) || 0, -40, device.h);
    if (patch.w !== undefined) patch.w = Math.max(4, Number(patch.w) || 100);
    if (patch.h !== undefined) patch.h = Math.max(1, Number(patch.h) || 40);
    out.push(createNode(type, device, patch));
  }
  return { name: parsed.name || 'AI 页面', nodes: out };
}

function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }

let toastTimer = null;
function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);

  modalTitle.textContent = title;

  const foot = buildFoot ? buildFoot() : null;
  if (foot) modalFoot.appendChild(foot);

  return {
    close() { modal.hidden = true; if (modalCleanup) { modalCleanup(); modalCleanup = null; } }
  };
}

  modal.hidden = true;
  if (modalCleanup) { modalCleanup(); modalCleanup = null; }
}

  if (!t.dataset || !t.dataset.act) return;
  const act = t.dataset.act;
  if (act === 'undo') { if (!store.undo()) toast('没有可撤销的操作'); }
  else if (act === 'redo') { if (!store.redo()) toast('没有可重做的操作'); }
  else if (act === 'zoom-in') store.setZoom(store.state.zoom + 0.1);
  else if (act === 'zoom-out') store.setZoom(store.state.zoom - 0.1);
  else if (act === 'zoom-fit') canvas.fit();
  else if (act === 'toggle-grid') store.toggleGrid();

  if (act === 'spec') return openSpec();

  if (name) store.addPage(name.trim());
});

/* ---------------- 键盘 ---------------- */
window.addEventListener('keydown', (e) => {
  const tag = (e.target && e.target.tagName) || '';
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return;

  const meta = e.ctrlKey || e.metaKey;

  if (meta && e.key.toLowerCase() === 'z') {
    e.preventDefault();
    if (e.shiftKey) store.redo(); else store.undo();
    return;
  }
  if (meta && e.key.toLowerCase() === 'y') {
    e.preventDefault(); store.redo(); return;
  }
  if (meta && e.key.toLowerCase() === 'd') {
    e.preventDefault(); store.duplicateSelected(); return;
  }
  if (meta && e.key.toLowerCase() === 'c') {
    if (store.state.selection.length) {
      e.preventDefault();
      const n = store.copySelected();
      toast('已复制 ' + n + ' 个元素');
    }
    return;
  }
  if (meta && e.key.toLowerCase() === 'v') {
    e.preventDefault();
    const n = store.pasteClipboard();
    if (n) toast('已粘贴 ' + n + ' 个元素');
    return;
  }
  if (meta && e.key.toLowerCase() === 's') {
    e.preventDefault(); exportProjectJSON(store.project); toast('项目 JSON 已保存'); return;
  }
  if (e.key === 'Delete' || e.key === 'Backspace') {
    if (store.state.selection.length) { e.preventDefault(); store.deleteSelected(); }
    return;
  }
  if (e.key === 'Escape') { store.clearSelection(); renderAll('selection'); return; }

  if (e.key.indexOf('Arrow') === 0 && store.state.selection.length) {
    e.preventDefault();
    const step = e.shiftKey ? 10 : 1;
    const dx = e.key === 'ArrowLeft' ? -step : (e.key === 'ArrowRight' ? step : 0);
    const dy = e.key === 'ArrowUp' ? -step : (e.key === 'ArrowDown' ? step : 0);
    const nodes = store.selectedNodes;
    store.mutate(() => {
      for (const n of nodes) { n.x += dx; n.y += dy; }
    }, { reason: 'move' });
  }
});

/* ---------------- 拖放组件 ---------------- */
canvasHost.addEventListener('dragover', (e) => {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'copy';
});

canvasHost.addEventListener('drop', (e) => {
  e.preventDefault();
  const type = e.dataTransfer.getData('text/plain');
  if (!type) return;
  const rect = canvasHost.getBoundingClientRect();
  const zoom = store.state.zoom;
  const x = Math.round((e.clientX - rect.left) / zoom);
  const y = Math.round((e.clientY - rect.top) / zoom);
  store.addNode(type, { x, y });
  toast('已添加：' + type);
});

      const row = document.createElement('div');
      row.style.cssText = 'display:flex;gap:12px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:8px;margin-bottom:8px;cursor:pointer;';
      row.addEventListener('mouseenter', () => { row.style.borderColor = 'var(--accent)'; });
      row.addEventListener('mouseleave', () => { row.style.borderColor = 'var(--line)'; });

      const box = document.createElement('div');
      const title = document.createElement('div');
      title.style.cssText = 'font-size:13px;color:var(--text)';
      title.textContent = it.label;
      const desc = document.createElement('div');
      desc.style.cssText = 'font-size:11px;color:var(--text-dim);margin-top:3px';
      desc.textContent = it.desc;
      box.appendChild(title);
      box.appendChild(desc);
      row.appendChild(box);

      row.addEventListener('click', async () => {
        closeModal();
        try { await it.run(); } catch (e) { toast('失败：' + e.message); }
      });
      wrap.appendChild(row);
    }
    return wrap;
  });
}

/* ---------------- 规格 ---------------- */
function openSpec() {
  const text = buildSpecText(store.page, store.project.name);
  openModal('规格清单', () => {
    const wrap = document.createElement('div');
    const hint = document.createElement('div');
    hint.className = 'hint';
    hint.textContent = '可以直接复制进作业答案，也可以拿去当交付说明。';
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.readOnly = true;
    wrap.appendChild(hint);
    wrap.appendChild(ta);
    return wrap;
  }, () => btn('复制', async () => {
    try {
      await navigator.clipboard.writeText(text);
      toast('已复制');
    } catch (e) {
      toast('复制失败，请手动选中');
    }
  }));
}

/* ---------------- AI ---------------- */
function openAI() {
  let panel = null;
  let controller = null;

  const m = openModal('AI 生成页面（自带 API Key）', () => {
    const wrap = document.createElement('div');
    panel = renderAIPanel(wrap, { store });
    return wrap;
  }, () => {
    const box = document.createElement('div');
    box.style.display = 'flex';
    box.style.gap = '8px';

    const stop = btn('停止', () => {
      if (controller) controller.abort();
      if (panel) panel.setStatus('已取消', true);
    });
    stop.style.display = 'none';

    const run = btn('生成', async () => {
      const settings = panel.getSettings();
      const prompt = panel.getPrompt();
      if (!prompt.trim()) { panel.setStatus('先写点要求', true); return; }

      controller = new AbortController();
      run.disabled = true;
      stop.style.display = '';
      panel.setStatus('正在请求模型…');

      try {
        const result = await generatePage(prompt, settings, store.device, controller.signal);
        if (!result.nodes.length) {
          panel.setStatus('模型没有返回可用的组件', true);
        } else {
          store.mutate(() => {
            const page = store.page;
            page.name = result.name || page.name;
            page.nodes.push(...result.nodes);
          }, { reason: 'ai' });
          store.select(result.nodes.map((n) => n.id));
          panel.setStatus('已生成 ' + result.nodes.length + ' 个组件，画布上看效果。');
          toast('AI 生成完成');
        }
      } catch (err) {
        if (err.name === 'AbortError') panel.setStatus('已取消', true);
        else panel.setStatus('失败：' + err.message, true);
      } finally {
        run.disabled = false;
        stop.style.display = 'none';
        controller = null;
      }
    });

    box.appendChild(stop);
    box.appendChild(run);
    return box;
  });

  modalCleanup = () => { if (controller) controller.abort(); };
  void m;
}

/* ---------------- 启动 ---------------- */
function seedFirstProject() {
  const page = store.page;
  if (page.nodes.length) return;
  const device = store.device;
  const navbar = createNode('navbar', device, { x: 0, y: 0, text: '首页', showBack: false, showAction: true });
  const title = createNode('text', device, {
    x: 16, y: 110, w: device.w - 32, h: 30, text: '欢迎使用开源版墨刀', fontSize: 22, fontWeight: 700
  });
  const tip = createNode('text', device, {
    x: 16, y: 150, w: device.w - 32, h: 60,
    text: '左边点组件加进来，拖动画布里的元素改样式；右侧能设交互，顶部可以预览、导出、AI 生成。',
    fontSize: 14, color: '#666666', lineHeight: 1.6
  });
  const btnNode = createNode('button', device, { x: 41, y: 236, w: device.w - 82, h: 44, text: '开始画' });
  page.nodes.push(navbar, title, tip, btnNode);
}

function boot() {
  fillDeviceSelect();
  const autoPreset = /[?&]preset=(1|demo)/.test(location.search);
  if (autoPreset) {
    store.loadProject(buildAssignmentProject());
  } else {
    const loaded = store.loadFromStorage();
    if (!loaded) seedFirstProject();
  }
  renderAll('boot');

  requestAnimationFrame(() => {
    canvas.fit();
    zoomLabel.textContent = Math.round(store.state.zoom * 100) + '%';
  });

  window.addEventListener('resize', () => {
    if (store.state.fitRequested) canvas.fit();
  });

  console.log('[modao-open] ready', store.project.pages.length, 'pages');
}

boot();
</script>
