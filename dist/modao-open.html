<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>墨刀开源版 · Modao Open</title>
<style>
:root {
  --bg-app: #14171c;
  --bg-panel: #1b1f26;
  --bg-panel-2: #21262f;
  --bg-input: #12151a;
  --line: #2c323d;
  --text: #e6e8ec;
  --text-dim: #9aa3af;
  --accent: #1677ff;
  --accent-2: #3b8bff;
  --danger: #ff4d4f;
  --ok: #22c55e;
  --warn: #f59e0b;
  --radius: 8px;
  --canvas-bg: #ffffff;
  --accent-soft: #17304f;
  --accent-soft-text: #cfe2ff;
  --hover: #2c323d;
  --stage-bg: linear-gradient(180deg, #101317, #161a20);
  --panel-solid: #21262f;
  --toast-bg: #2b3240;
  --ai-color: #d9d0ff;
  --canvas-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
}

/* 浅色主题 */
:root[data-theme="light"] {
  --bg-app: #f4f5f7;
  --bg-panel: #ffffff;
  --bg-panel-2: #f2f3f5;
  --bg-input: #f7f8fa;
  --line: #e3e4e6;
  --text: #1b1f24;
  --text-dim: #6b7280;
  --accent-soft: #e8f0fe;
  --accent-soft-text: #0b5cd5;
  --hover: #eceef1;
  --stage-bg: linear-gradient(180deg, #eceef1, #f7f8fa);
  --panel-solid: #ffffff;
  --toast-bg: #39414f;
  --ai-color: #6d4aff;
  --canvas-shadow: 0 8px 28px rgba(20, 30, 50, 0.16);
}

/* 跟随系统：系统是浅色时套用浅色变量 */
@media (prefers-color-scheme: light) {
  :root[data-theme="auto"] {
    --bg-app: #f4f5f7;
    --bg-panel: #ffffff;
    --bg-panel-2: #f2f3f5;
    --bg-input: #f7f8fa;
    --line: #e3e4e6;
    --text: #1b1f24;
    --text-dim: #6b7280;
    --accent-soft: #e8f0fe;
    --accent-soft-text: #0b5cd5;
    --hover: #eceef1;
    --stage-bg: linear-gradient(180deg, #eceef1, #f7f8fa);
    --panel-solid: #ffffff;
    --toast-bg: #39414f;
  }
}

* { box-sizing: border-box; }

html, body, #app { height: 100%; margin: 0; }

body {
  background: var(--bg-app);
  color: var(--text);
  font: 13px/1.45 "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}

#app { display: flex; flex-direction: column; }

/* ---------- topbar ---------- */
.topbar {
  flex: 0 0 48px;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 12px;
  background: var(--bg-panel);
  border-bottom: 1px solid var(--line);
  min-width: 0;
}

.brand { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }

.project-name {
  background: transparent;
  border: 1px solid transparent;
  color: var(--text);
  font-size: 13px;
  font-weight: 600;
  padding: 4px 6px;
  border-radius: 6px;
  width: 150px;
}
.project-name:hover { border-color: var(--line); }
.project-name:focus { border-color: var(--accent); outline: none; background: var(--bg-input); }

.toolbar { display: flex; align-items: center; gap: 6px; flex: 1; min-width: 0; overflow: hidden; }
.right-actions { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; }

.tb {
  background: var(--bg-panel-2);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 5px 10px;
  font-size: 12px;
  cursor: pointer;
  white-space: nowrap;
}
.tb:hover { border-color: #3f4756; background: #262c36; }
.tb.on { border-color: var(--accent); color: var(--accent-soft-text); background: var(--accent-soft); }
.tb.ai { border-color: #6d4aff; color: var(--ai-color); }
.tb.ai:hover { background: #241a3d; }

.tb-select {
  background: var(--bg-panel-2);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 5px 8px;
  font-size: 12px;
}

.sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }
.zoom-label { font-size: 12px; color: var(--text-dim); width: 44px; text-align: center; }

.tb-group { display: flex; align-items: center; gap: 2px; }

.icon-btn {
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 6px;
  color: var(--text-dim);
  cursor: pointer;
  padding: 0;
  flex: 0 0 auto;
}
.icon-btn:hover { background: var(--bg-panel-2); color: var(--text); border-color: var(--line); }
.icon-btn.on { background: var(--accent-soft); color: var(--accent-soft-text); border-color: var(--accent); }
.icon-btn svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.7;
  stroke-linecap: round;
  stroke-linejoin: round;
}

/* ---------- body ---------- */
.body { flex: 1; display: flex; min-height: 0; }

.left {
  flex: 0 0 196px;
  background: var(--bg-panel);
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.right {
  flex: 0 0 248px;
  background: var(--bg-panel);
  border-left: 1px solid var(--line);
  overflow: auto;
  min-height: 0;
}

.pane-title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 9px 10px 6px;
  font-size: 11px;
  letter-spacing: .04em;
  color: var(--text-dim);
  text-transform: uppercase;
}

.mini {
  background: transparent;
  border: 1px solid var(--line);
  color: var(--text-dim);
  border-radius: 5px;
  width: 20px; height: 20px;
  line-height: 16px;
  font-size: 12px;
  cursor: pointer;
  padding: 0;
}
.mini:hover { color: var(--text); border-color: #3f4756; }

.page-list { padding: 0 8px 8px; overflow: auto; }

.page-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 6px 8px;
  border-radius: 6px;
  cursor: pointer;
  color: var(--text-dim);
  font-size: 12px;
}
.page-item:hover { background: var(--bg-panel-2); color: var(--text); }
.page-item.active { background: var(--accent-soft); color: var(--accent-soft-text); }
.page-item .p-icon { display: flex; align-items: center; opacity: .7; flex: 0 0 auto; }
.page-item .pname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.page-item .del { opacity: 0; font-size: 11px; }
.page-item:hover .del { opacity: .7; }

.library { flex: 1; overflow: auto; padding: 0 8px 12px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; align-content: start; }

.lib-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 9px 4px;
  background: var(--bg-panel-2);
  border: 1px solid var(--line);
  border-radius: 7px;
  cursor: pointer;
  font-size: 11px;
  color: var(--text-dim);
  user-select: none;
}
.lib-item:hover { border-color: var(--accent); color: var(--text); }
.lib-item svg { opacity: .9; }

.layer-list { overflow: auto; padding: 0 6px 8px; }

/* 左栏三块面板：可拖拽分隔 */
.pane { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
.pane .pane-title { flex: 0 0 auto; }
.pane .page-list, .pane .layer-list, .pane .library { flex: 1 1 auto; min-height: 0; }
.resizer {
  flex: 0 0 6px;
  cursor: row-resize;
  background: transparent;
  position: relative;
}
.resizer:hover { background: var(--hover); }
.resizer::after {
  content: '';
  position: absolute;
  left: 0; right: 0; top: 2px;
  height: 1px;
  background: var(--line);
}
.lib-search-wrap { padding: 0 8px 6px; flex: 0 0 auto; }
.lib-search {
  width: 100%;
  box-sizing: border-box;
  background: var(--bg-input);
  border: 1px solid var(--line);
  border-radius: 5px;
  color: var(--text);
  padding: 4px 8px;
  font-size: 12px;
  outline: none;
}
.lib-search:focus { border-color: var(--accent); }
.lib-group-title {
  grid-column: 1 / -1;
  font-size: 10px;
  color: var(--text-dim);
  letter-spacing: .05em;
  margin: 6px 0 1px;
  padding-left: 2px;
}

.layer-item {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 4px 6px;
  border-radius: 5px;
  cursor: pointer;
  font-size: 12px;
  color: var(--text-dim);
}
.layer-item:hover { background: var(--bg-panel-2); color: var(--text); }
.layer-item.active { background: var(--accent-soft); color: var(--accent-soft-text); }
.layer-item.is-hidden { opacity: .45; }
.layer-item .l-icon {
  width: 14px;
  flex: 0 0 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: .85;
}
.layer-item .l-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layer-item .l-btn {
  width: 18px; height: 18px;
  display: flex; align-items: center; justify-content: center;
  border: none; background: transparent; color: inherit; opacity: .55; padding: 0;
}
.layer-item .l-btn:hover { opacity: 1; }

/* ---------- stage ---------- */
.stage {
  flex: 1;
  min-width: 0;
  background:
    var(--stage-bg);
  overflow: hidden;
  position: relative;
}
.stage-scroll { position: absolute; inset: 0; overflow: auto; display: flex; align-items: flex-start; justify-content: center; padding: 28px; }

.canvas-wrap { position: relative; }

.canvas-host {
  position: relative;
  width: 402px;
  height: 874px;
  background: var(--canvas-bg);
  box-shadow: var(--canvas-shadow);
  transform-origin: top left;
  overflow: hidden;
}

.canvas-host.grid::before {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(to right, rgba(22,119,255,.10) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(22,119,255,.10) 1px, transparent 1px);
  background-size: 20px 20px;
  z-index: 0;
}

.nodes-layer, .links-layer, .hints-layer { position: absolute; inset: 0; }
.nodes-layer { z-index: 2; }
.links-layer { z-index: 4; pointer-events: none; }
.hints-layer { z-index: 3; pointer-events: none; }

.node {
  position: absolute;
  box-sizing: border-box;
  cursor: move;
  font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  overflow: hidden;
  user-select: none;
}
.node.sel { outline: 1.5px solid var(--accent); outline-offset: 0; }
.node.locked { cursor: default; }

.handle {
  position: absolute;
  width: 8px; height: 8px;
  background: #fff;
  border: 1.5px solid var(--accent);
  border-radius: 2px;
  z-index: 10;
}
.handle.nw { left: -5px; top: -5px; cursor: nwse-resize; }
.handle.n  { left: 50%; top: -5px; margin-left: -4px; cursor: ns-resize; }
.handle.ne { right: -5px; top: -5px; cursor: nesw-resize; }
.handle.e  { right: -5px; top: 50%; margin-top: -4px; cursor: ew-resize; }
.handle.se { right: -5px; bottom: -5px; cursor: nwse-resize; }
.handle.s  { left: 50%; bottom: -5px; margin-left: -4px; cursor: ns-resize; }
.handle.sw { left: -5px; bottom: -5px; cursor: nesw-resize; }
.handle.w  { left: -5px; top: 50%; margin-top: -4px; cursor: ew-resize; }

.hint-line { position: absolute; background: #ff3b7f; z-index: 5; pointer-events: none; }
.hint-label {
  position: absolute;
  background: #ff3b7f;
  color: #fff;
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 3px;
  z-index: 6;
  pointer-events: none;
  white-space: nowrap;
}

/* ---------- inspector ---------- */
.inspector { padding: 4px 10px 20px; }
.group { margin-bottom: 12px; }
.group-title {
  font-size: 11px;
  color: var(--text-dim);
  margin: 10px 0 6px;
  letter-spacing: .03em;
}

.group-head {
  display: flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
  user-select: none;
  padding: 2px 0;
}
.group-head:hover { color: var(--text); }
.group-head .caret {
  width: 10px;
  height: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: .75;
}
.group-head .caret svg { transition: transform .12s ease; transform: rotate(90deg); }
.group.collapsed .group-head .caret svg { transform: rotate(0deg); }
.group.collapsed { margin-bottom: 4px; }
.row { display: flex; gap: 6px; margin-bottom: 6px; align-items: center; }
.row > * { min-width: 0; }

.field {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--bg-input);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 3px 6px;
}
.field > span { font-size: 10px; color: var(--text-dim); flex: 0 0 auto; }
.field input, .field select {
  flex: 1;
  width: 100%;
  background: transparent;
  border: none;
  color: var(--text);
  font-size: 12px;
  outline: none;
  padding: 1px 0;
}
.field input[type=color] { height: 18px; padding: 0; cursor: pointer; }

.full { width: 100%; }
textarea.full {
  background: var(--bg-input);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 5px;
  padding: 6px;
  font-size: 12px;
  font-family: inherit;
  resize: vertical;
  min-height: 54px;
}

.seg { display: flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }
.seg button {
  flex: 1;
  background: var(--bg-input);
  border: none;
  color: var(--text-dim);
  font-size: 11px;
  padding: 4px 2px;
  cursor: pointer;
}
.seg button.on { background: var(--accent-soft); color: var(--accent-soft-text); }
.seg button + button { border-left: 1px solid var(--line); }

.empty-hint { color: var(--text-dim); font-size: 12px; line-height: 1.7; padding: 8px 2px; }
.empty-hint kbd {
  background: var(--bg-input);
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: 0 4px;
  font-size: 11px;
}

/* ---------- toast / modal ---------- */
.toast {
  position: fixed;
  left: 50%;
  bottom: 28px;
  transform: translateX(-50%) translateY(12px);
  background: var(--toast-bg);
  color: #fff;
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 12px;
  opacity: 0;
  pointer-events: none;
  transition: opacity .18s, transform .18s;
  z-index: 999;
  border: 1px solid #3b4453;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 900;
}
.modal[hidden] { display: none; }
.modal-box {
  width: min(760px, 92vw);
  max-height: 86vh;
  background: var(--bg-panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
}
.modal-body { padding: 12px; overflow: auto; }
.modal-foot {
  padding: 10px 12px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: flex-end;
  gap: 8px;
}
.modal-body textarea {
  width: 100%;
  min-height: 320px;
  background: var(--bg-input);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 6px;
  padding: 10px;
  font-family: ui-monospace, Consolas, monospace;
  font-size: 12px;
  line-height: 1.55;
  resize: vertical;
}
.modal-body .hint { color: var(--text-dim); font-size: 12px; margin-bottom: 8px; line-height: 1.7; }
.modal-body label { display: block; font-size: 12px; color: var(--text-dim); margin: 8px 0 4px; }
.modal-body input, .modal-body select {
  width: 100%;
  background: var(--bg-input);
  border: 1px solid var(--line);
  color: var(--text);
  border-radius: 6px;
  padding: 7px 9px;
  font-size: 12px;
  outline: none;
}
.modal-body input:focus, .modal-body select:focus { border-color: var(--accent); }

/* ---------- 空状态引导 ---------- */
.empty-guide {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: min(320px, 80%);
  background: var(--panel-solid);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 18px 20px;
  box-shadow: 0 14px 44px rgba(0, 0, 0, 0.55);
  z-index: 20;
  color: var(--text);
}
.empty-guide[hidden] { display: none; }
.eg-title { font-size: 14px; font-weight: 700; margin-bottom: 10px; }
.eg-steps { margin: 0 0 14px; padding-left: 18px; font-size: 12px; line-height: 1.9; color: var(--text-dim); }
.eg-actions { display: flex; gap: 8px; }

/* ---------- 右键菜单 ---------- */
.ctx-menu {
  position: fixed;
  min-width: 176px;
  background: var(--bg-panel-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 4px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
  z-index: 1000;
  display: flex;
  flex-direction: column;
}
.ctx-menu[hidden] { display: none; }
.ctx-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  width: 100%;
  padding: 6px 9px;
  background: transparent;
  border: none;
  border-radius: 5px;
  color: var(--text);
  font-size: 12px;
  text-align: left;
  cursor: pointer;
}
.ctx-item:hover:not(:disabled) { background: #2c333f; }
.ctx-item:disabled { opacity: 0.4; cursor: default; }
.ctx-item.danger { color: #ff9b9d; }
.ctx-hint { font-size: 10px; color: var(--text-dim); }
.ctx-divider { height: 1px; background: var(--line); margin: 4px 2px; }

/* ---------- preview ---------- */
.preview-mask {
  position: fixed;
  inset: 0;
  background: #0b0d10;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 950;
}
.preview-mask[hidden] { display: none; }
.preview-frame {
  display: flex;
  flex-direction: column;
  gap: 10px;
  align-items: center;
}
.preview-toolbar {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  color: var(--text-dim);
  font-size: 12px;
}
.preview-toolbar .spacer { flex: 1; }
.preview-host {
  background: #fff;
  box-shadow: 0 10px 40px rgba(0,0,0,.6);
  overflow: hidden;
  position: relative;
}

/* ---------- links ---------- */
.link-path { stroke: #1677ff; stroke-width: 1.4; fill: none; stroke-dasharray: 4 3; opacity: .85; }
.link-path:hover { stroke: #3b8bff; stroke-width: 2; }
.link-badge { fill: #1677ff; }

/* scrollbars */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: #333b47; border-radius: 6px; border: 2px solid var(--bg-app); }
::-webkit-scrollbar-thumb:hover { background: #414b5a; }
::-webkit-scrollbar-track { background: transparent; }

@media (max-width: 1100px) {
  .left { flex-basis: 168px; }
  .right { flex-basis: 220px; }
}

</style>

</head>
<body>
<div id="app">

  <header class="topbar">
    <div class="brand">
      <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="4" y="2.5" width="16" height="19" rx="2.5" fill="#1677ff"/>
        <rect x="7.5" y="7.5" width="9" height="2.6" rx="1" fill="#fff"/>
        <rect x="7.5" y="12" width="9" height="3.4" rx="1" fill="#fff"/>
        <rect x="7.5" y="17" width="9" height="2.2" rx="1" fill="#fff"/>
      </svg>
      <input id="projectName" class="project-name" value="未命名原型" spellcheck="false">
    </div>

    <div class="toolbar" id="toolbar">
      <div class="tb-group">
        <button class="icon-btn" data-act="undo" title="撤销 (Ctrl+Z)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14L4 9l5-5"/><path d="M4 9h9a5 5 0 0 1 0 10h-3"/></svg>
        </button>
        <button class="icon-btn" data-act="redo" title="重做 (Ctrl+Shift+Z)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 14l5-5-5-5"/><path d="M20 9h-9a5 5 0 0 0 0 10h3"/></svg>

function getComponent(type) {
  for (const c of COMPONENTS) if (c.type === type) return c;
  return COMPONENTS[0];
}

/** 通用节点属性 + 组件默认值 */
function baseNode(type, device) {
  return {
    id: uid(),
    type,
    name: '',
    x: 0,
    y: 0,
    w: 100,
    h: 40,
    rotation: 0,
    opacity: 1,
    bg: 'transparent',
    radius: 0,
    borderWidth: 0,
    borderColor: '#e5e5e5',
    shadow: 'none',
    text: '',
    fontSize: 16,
    fontWeight: 400,
    color: '#222222',
    align: 'left',
    verticalAlign: 'center',
    lineHeight: 1.4,
    paddingX: 0,
    src: '',
    locked: false,
    hidden: false,
    // 组件状态（墨刀式动态组件的轻量实现：外观变体）
    states: null,        // [{ id, name, style: { bg, text, color, ... } }]
    activeStateId: null,
    // 浮层（仅 group 用）：作为弹层挂在页面最上层，可带遮罩
    overlay: false,
    overlayMask: true,
    defaultOpen: false,
    // 交互（墨刀式）：触发方式 + 行为
    link: null
  };
}

/** 取节点当前生效的状态对象（没有状态则返回 null） */
function currentState(node) {
  if (!node || !node.states || !node.states.length) return null;
  for (const s of node.states) if (s.id === node.activeStateId) return s;
  return node.states[0];
}

/** 取"叠加了当前状态外观"的节点视图；不修改原对象 */
function viewOf(node) {
  const st = currentState(node);
  if (!st || !st.style) return node;
  const merged = Object.assign({}, node, st.style);
  merged.id = node.id;
  merged.type = node.type;
  merged.x = node.x;
  merged.y = node.y;
  merged.w = node.w;
  merged.h = node.h;
  merged.states = node.states;
  merged.activeStateId = node.activeStateId;
  merged.link = node.link;
  return merged;
}

/** 组件状态可选的外观字段（限制范围，避免状态改到位置尺寸） */
const STATE_STYLE_KEYS = ['text', 'bg', 'color', 'radius', 'fontSize', 'fontWeight', 'borderColor', 'borderWidth', 'align', 'opacity', 'icon', 'checked', 'on', 'activeIndex'];

function createNode(type, device, patch = {}) {
  const def = getComponent(type);
  const node = Object.assign(baseNode(type, device), def.defaults(device), patch);
  if (!node.name) node.name = def.label;
  // 默认放在可视区上方居中一点，避免全部堆在原点
  if (patch.x === undefined) node.x = Math.round((device.w - node.w) / 2);
  if (patch.y === undefined) node.y = 80;
  return node;
}

function createPage(name, deviceId = 'iphone17') {
  return {
    id: uid('p'),
    name: name || '页面 1',
    deviceId,
    bg: '#ffffff',
    nodes: []
  };
}

/** 条件运算符 */
const CONDITION_OPS = [
  { value: 'eq', label: '等于' },
  { value: 'neq', label: '不等于' },
  { value: 'truthy', label: '为真' },
  { value: 'falsy', label: '为假' }
];

function createVariable(name, value) {
  return {
    id: uid('v'),
    name: name || 'var' + Math.floor(Math.random() * 1000),
    value: value == null ? '' : String(value)
  };
}

function createProject(name = '未命名原型') {
  const page = createPage('首页');
  return {
    version: 1,
    name,
    pages: [page],
    activePageId: page.id,
    variables: [],
    createdAt: new Date().toISOString()
  };
}

/** 兼容外部 JSON：补齐缺省字段 */
function normalizeProject(raw) {
  if (!raw || typeof raw !== 'object' || !Array.isArray(raw.pages) || !raw.pages.length) {
    throw new Error('项目文件格式不正确：缺少 pages');
  }
  const pages = raw.pages.map((p, i) => {
    const deviceId = getDevice(p.deviceId).id;
    const device = getDevice(deviceId);
    const nodes = Array.isArray(p.nodes) ? p.nodes.map((n) => {
      const node = Object.assign(baseNode(n.type || 'rect', device), n);
      node.id = n.id || uid();
      return node;
    }) : [];
    return {
      id: p.id || uid('p'),
      name: p.name || ('页面 ' + (i + 1)),
      deviceId,
      bg: p.bg || '#ffffff',
      customW: p.customW > 0 ? Math.round(p.customW) : null,
      customH: p.customH > 0 ? Math.round(p.customH) : null,
      nodes
    };
  });
  return {
    version: 1,
    name: raw.name || '未命名原型',
    pages,
    activePageId: pages.some((p) => p.id === raw.activePageId) ? raw.activePageId : pages[0].id,
    variables: Array.isArray(raw.variables) ? raw.variables.map((v) => ({
      id: v.id || uid('v'),
      name: String(v.name == null ? 'var' : v.name),
      value: v.value == null ? '' : String(v.value)
    })) : [],
    createdAt: raw.createdAt || new Date().toISOString()
  };
}

function cloneNode(node) {
  const copy = JSON.parse(JSON.stringify(node));
  copy.id = uid();
  copy.name = node.name;
  return copy;
}

/* ===== src/store.js ===== */
/**
 * 状态仓库：项目数据 + 选择 + 视图状态，带撤销/重做与本地持久化。
 * 所有修改都走 mutate()，保证快照一致。
 */



const STORAGE_KEY = 'modao-open:project:v1';

function deepClone(v) {
  return JSON.parse(JSON.stringify(v));
}

class Store {
  constructor() {
    this.state = {
      project: createProject(),
      selection: [],          // 选中节点 id 数组
      zoom: 1,
      showGrid: true,
      showLinks: true,
      inspectMode: false,
      spacePanning: false,
      fitRequested: true
    };
    this.listeners = new Set();
    this.undoStack = [];
    this.redoStack = [];
    this.clipboard = [];
    this.pending = false;
    this.maxHistory = 80;
  }

  /* ---------- 订阅 ---------- */
  subscribe(fn) {
    this.listeners.add(fn);
    return () => this.listeners.delete(fn);
  }

  emit(reason = 'change') {
    for (const fn of this.listeners) {
      try { fn(this.state, reason); } catch (e) { console.error('[store] listener error', e); }
    }
  }

  /* ---------- 基础访问 ---------- */
  get project() { return this.state.project; }

  get page() {
    const id = this.state.project.activePageId;
    return this.state.project.pages.find((p) => p.id === id) || this.state.project.pages[0];
  }

  get device() { return resolveDevice(this.page); }

  get selectedNodes() {
    const ids = new Set(this.state.selection);
    return this.page.nodes.filter((n) => ids.has(n.id));
  }

  get selectedNode() { return this.selectedNodes[0] || null; }

  nodeById(id) { return this.page.nodes.find((n) => n.id === id) || null; }

  isSelected(id) { return this.state.selection.indexOf(id) >= 0; }

  /* ---------- 历史 ---------- */
  snapshot() {
    return JSON.stringify({ project: this.state.project, activePageId: this.state.project.activePageId });
  }

  pushHistory() {
    this.undoStack.push(this.snapshot());
    if (this.undoStack.length > this.maxHistory) this.undoStack.shift();
    this.redoStack.length = 0;
  }

  undo() {
    if (!this.undoStack.length) return false;
    this.redoStack.push(this.snapshot());
    this.restore(this.undoStack.pop());
    return true;
  }

  redo() {
    if (!this.redoStack.length) return false;
    this.undoStack.push(this.snapshot());
    this.restore(this.redoStack.pop());
    return true;
  }

  restore(json) {
    const data = JSON.parse(json);
    this.state.project = data.project;
    this.state.selection = [];
    this.emit('restore');
    this.persist();
  }

  /**
   * 统一修改入口。history=true 时先压栈（一次用户操作 = 一条历史）。
   */
  mutate(fn, options = {}) {
    const { history = true, reason = 'mutate' } = options;
    if (history) this.pushHistory();
    fn(this.state.project, this.state);
    this.emit(reason);
    this.persist();
  }

  /* ---------- 选择 ---------- */
  select(ids, additive = false) {
    const list = Array.isArray(ids) ? ids : (ids ? [ids] : []);
    if (additive) {
      const set = new Set(this.state.selection);
      for (const id of list) {
        if (set.has(id)) set.delete(id); else set.add(id);
      }
      this.state.selection = Array.from(set);
    } else {
      this.state.selection = list.slice();
    }
    this.emit('selection');
  }

  clearSelection() { this.select([]); }

  /* ---------- 节点操作 ---------- */
  addNode(type, patch = {}) {
    const device = this.device;
    const node = createNode(type, device, patch);
    // 只有调用方没指定 y 时才自动找空位（拖放到画布时必须尊重落点）
    if (patch.y === undefined) node.y = this.nextFreeY(node.h);
    this.mutate((project) => {
      const page = this.page;
      page.nodes.push(node);
    }, { reason: 'add-node' });
    this.select([node.id]);
    return node;
  }

  addNodeObject(node) {
    this.mutate(() => { this.page.nodes.push(node); }, { reason: 'add-node' });
    this.select([node.id]);
    return node;
  }

  nextFreeY(h) {
    const nodes = this.page.nodes;
    if (!nodes.length) return 80;
    let maxBottom = 0;
    for (const n of nodes) if (!n.hidden) maxBottom = Math.max(maxBottom, n.y + n.h);
    return Math.min(maxBottom + 16, Math.max(80, this.device.h - h - 24));
  }

  updateNode(id, patch, options = {}) {
    const node = this.nodeById(id);
    if (!node) return;
    this.mutate(() => { Object.assign(node, patch); }, options);
  }

  updateSelected(patch, options = {}) {
    const nodes = this.selectedNodes;
    if (!nodes.length) return;
    this.mutate(() => { for (const n of nodes) Object.assign(n, patch); }, options);
  }

  deleteSelected() {
    if (!this.state.selection.length) return;
    const ids = new Set(this.state.selection);
    this.mutate(() => {
      const page = this.page;
      page.nodes = page.nodes.filter((n) => !ids.has(n.id));
    }, { reason: 'delete' });
    this.state.selection = [];
    this.emit('selection');
  }

  duplicateSelected() {
    const nodes = this.selectedNodes;
    if (!nodes.length) return;
    const copies = nodes.map((n) => {
      const c = cloneNode(n);
      c.x = n.x + 16;
      c.y = n.y + 16;
      return c;
    });
    this.mutate(() => { this.page.nodes.push(...copies); }, { reason: 'duplicate' });
    this.select(copies.map((c) => c.id));
  }

  /* ---------- 组件状态（动态组件 · 外观变体） ---------- */
  addState(nodeId, name) {
    const node = this.nodeById(nodeId);
    if (!node) return null;
    const st = {
      id: uid('s'),
      name: name || ('状态 ' + ((node.states ? node.states.length : 0) + 1)),
      style: {}
    };
    this.mutate(() => {
      if (!node.states) node.states = [];
      node.states.push(st);
      node.activeStateId = st.id;
    }, { reason: 'state' });
    return st;
  }

  setActiveState(nodeId, stateId) {
    const node = this.nodeById(nodeId);
    if (!node || !node.states) return;
    this.mutate(() => { node.activeStateId = stateId; }, { reason: 'state' });
  }

  removeState(nodeId, stateId) {
    const node = this.nodeById(nodeId);
    if (!node || !node.states) return;
    this.mutate(() => {
      node.states = node.states.filter((s) => s.id !== stateId);
      if (!node.states.length) { node.states = null; node.activeStateId = null; return; }
      if (node.activeStateId === stateId) node.activeStateId = node.states[0].id;
    }, { reason: 'state' });
  }

  renameState(nodeId, stateId, name) {
    const node = this.nodeById(nodeId);
    if (!node || !node.states) return;
    this.mutate(() => {
      for (const s of node.states) if (s.id === stateId) s.name = name;
    }, { reason: 'state' });
  }

  /** 把当前外观存进某个状态（覆盖该状态的 style） */
  captureStateStyle(nodeId, stateId, keys) {
    const node = this.nodeById(nodeId);
    if (!node || !node.states) return;
    const style = {};
    for (const k of keys) style[k] = node[k];
    this.mutate(() => {
      for (const s of node.states) if (s.id === stateId) s.style = style;
    }, { reason: 'state' });
  }

  /* ---------- 组合 / 解组 ---------- */
  makeGroupNode(x, y, w, h) {
    return {
      id: uid('g'),
      type: 'group',
      name: '分组',
      x, y, w, h,
      rotation: 0,
      opacity: 1,
      bg: 'transparent',
      radius: 0,
      borderWidth: 0,
      borderColor: '#e5e5e5',
      shadow: 'none',
      text: '',
      fontSize: 16,
      fontWeight: 400,
      color: '#222222',
      align: 'left',
      verticalAlign: 'center',
      lineHeight: 1.4,
      paddingX: 0,
      src: '',
      locked: false,
      hidden: false,
      states: null,
      activeStateId: null,
      overlay: false,
      overlayMask: true,
      defaultOpen: false,
      link: null,
      children: []
    };
  }

  /** 把当前选中的多个元素打成一个组 */
  groupSelected() {
    const nodes = this.selectedNodes;
    if (nodes.length < 2) return null;

    let x1 = Infinity;
    let y1 = Infinity;
    let x2 = -Infinity;
    let y2 = -Infinity;
    for (const n of nodes) {
      x1 = Math.min(x1, n.x);
      y1 = Math.min(y1, n.y);
      x2 = Math.max(x2, n.x + n.w);
      y2 = Math.max(y2, n.y + n.h);
    }

    const group = this.makeGroupNode(Math.round(x1), Math.round(y1), Math.round(x2 - x1), Math.round(y2 - y1));
    const ids = new Set(nodes.map((n) => n.id));

    this.mutate(() => {
      const page = this.page;
      const kept = [];
      for (const n of page.nodes) {
        if (ids.has(n.id)) {
          n.x = n.x - group.x;
          n.y = n.y - group.y;
          group.children.push(n);
        } else {
          kept.push(n);
        }
      }
      kept.push(group);
      page.nodes = kept;
    }, { reason: 'group' });

    this.select([group.id]);
    return group;
  }

  /** 解散选中的组，子元素回到页面坐标 */
  ungroupSelected() {
    const groups = this.selectedNodes.filter((n) => n.type === 'group' && Array.isArray(n.children) && n.children.length);
    if (!groups.length) return 0;
    let count = 0;

    this.mutate(() => {
      const page = this.page;
      const next = [];
      for (const n of page.nodes) {
        if (groups.indexOf(n) >= 0) {
          for (const c of n.children) {
            c.x = c.x + n.x;
            c.y = c.y + n.y;
            next.push(c);
            count += 1;
          }
        } else {
          next.push(n);
        }
      }
      page.nodes = next;
    }, { reason: 'ungroup' });

    this.select([]);
    return count;
  }

  isGrouped(node) {
    return !!(node && node.type === 'group' && Array.isArray(node.children));
  }

  /** 把组设为/取消浮层 */
  setOverlay(nodeId, patch) {
    const node = this.nodeById(nodeId);
    if (!node || node.type !== 'group') return;
    this.mutate(() => {
      if (patch.overlay !== undefined) node.overlay = !!patch.overlay;
      if (patch.overlayMask !== undefined) node.overlayMask = !!patch.overlayMask;
      if (patch.defaultOpen !== undefined) node.defaultOpen = !!patch.defaultOpen;
    }, { reason: 'overlay' });
  }

  /* ---------- 剪贴板 ---------- */
  copySelected() {
    const nodes = this.selectedNodes;
    if (!nodes.length) return 0;
    this.clipboard = JSON.parse(JSON.stringify(nodes));
    return nodes.length;
  }

  pasteClipboard() {
    const cb = this.clipboard;
    if (!cb || !cb.length) return 0;
    const copies = cb.map((n) => {
      const c = JSON.parse(JSON.stringify(n));
      c.id = uid();
      c.x = (c.x || 0) + 16;
      c.y = (c.y || 0) + 16;
      return c;
    });
    this.mutate(() => { this.page.nodes.push(...copies); }, { reason: 'paste' });
    this.select(copies.map((c) => c.id));
    this.clipboard = copies.map((c) => JSON.parse(JSON.stringify(c)));
    return copies.length;
  }

  /* 层级 */
  bringForward(id) {
    const list = this.page.nodes;
    const i = list.findIndex((n) => n.id === id);
    if (i < 0 || i === list.length - 1) return;
    this.mutate(() => { const [n] = list.splice(i, 1); list.splice(i + 1, 0, n); }, { reason: 'order' });
  }

  sendBackward(id) {
    const list = this.page.nodes;
    const i = list.findIndex((n) => n.id === id);
    if (i <= 0) return;
    this.mutate(() => { const [n] = list.splice(i, 1); list.splice(i - 1, 0, n); }, { reason: 'order' });
  }

  bringToFront(id) {
    const list = this.page.nodes;
    const i = list.findIndex((n) => n.id === id);
    if (i < 0 || i === list.length - 1) return;
    this.mutate(() => { const [n] = list.splice(i, 1); list.push(n); }, { reason: 'order' });
  }

  sendToBack(id) {
    const list = this.page.nodes;
    const i = list.findIndex((n) => n.id === id);
    if (i <= 0) return;
    this.mutate(() => { const [n] = list.splice(i, 1); list.unshift(n); }, { reason: 'order' });
  }

  /* ---------- 对齐（基于当前选中，或用画布） ---------- */
  align(kind) {
    const nodes = this.selectedNodes;
    if (!nodes.length) return;
    const dev = this.device;
    const bounds = this.selectionBounds();
    this.mutate(() => {
      for (const n of nodes) {
        if (kind === 'left') n.x = 16;
        else if (kind === 'right') n.x = dev.w - 16 - n.w;
        else if (kind === 'hcenter') n.x = Math.round((dev.w - n.w) / 2);
        else if (kind === 'top') n.y = 16;
        else if (kind === 'bottom') n.y = dev.h - 16 - n.h;
        else if (kind === 'vcenter') n.y = Math.round((dev.h - n.h) / 2);
        else if (kind === 'distribute-h' && nodes.length > 1) { /* 下面单独处理 */ }
        else if (kind === 'distribute-v' && nodes.length > 1) { /* 下面单独处理 */ }
      }
      if (kind === 'distribute-h' && nodes.length > 1) {
        const sorted = nodes.slice().sort((a, b) => a.x - b.x);
        const left = sorted[0].x;
        const right = sorted[sorted.length - 1].x + sorted[sorted.length - 1].w;
        const totalW = sorted.reduce((s, n) => s + n.w, 0);
        const gap = (right - left - totalW) / (sorted.length - 1);
        let cursor = left;
        for (const n of sorted) { n.x = Math.round(cursor); cursor += n.w + gap; }
      }
      if (kind === 'distribute-v' && nodes.length > 1) {
        const sorted = nodes.slice().sort((a, b) => a.y - b.y);
        const top = sorted[0].y;
        const bottom = sorted[sorted.length - 1].y + sorted[sorted.length - 1].h;
        const totalH = sorted.reduce((s, n) => s + n.h, 0);
        const gap = (bottom - top - totalH) / (sorted.length - 1);
        let cursor = top;
        for (const n of sorted) { n.y = Math.round(cursor); cursor += n.h + gap; }
      }
      void bounds;
    }, { reason: 'align' });
  }

  selectionBounds() {
    const nodes = this.selectedNodes;
    if (!nodes.length) return null;
    let x1 = Infinity, y1 = Infinity, x2 = -Infinity, y2 = -Infinity;
    for (const n of nodes) {
      x1 = Math.min(x1, n.x); y1 = Math.min(y1, n.y);
      x2 = Math.max(x2, n.x + n.w); y2 = Math.max(y2, n.y + n.h);
    }
    return { x: x1, y: y1, w: x2 - x1, h: y2 - y1 };
  }

  /* ---------- 页面 ---------- */
  addPage(name) {
    const page = createPage(name || ('页面 ' + (this.project.pages.length + 1)), this.page.deviceId);
    this.mutate((project) => {
      project.pages.push(page);
      project.activePageId = page.id;
    }, { reason: 'page' });
    this.state.selection = [];
    this.emit('selection');
    return page;
  }

  deletePage(id) {
    if (this.project.pages.length <= 1) return false;
    this.mutate((project) => {
      project.pages = project.pages.filter((p) => p.id !== id);
      if (project.activePageId === id) project.activePageId = project.pages[0].id;
    }, { reason: 'page' });
    this.state.selection = [];
    this.emit('selection');
    return true;
  }

  setActivePage(id) {
    if (this.page.id === id) return;
    this.mutate((project) => { project.activePageId = id; }, { history: false, reason: 'page' });
    this.state.selection = [];
    this.emit('selection');
  }

  renamePage(id, name) {
    const page = this.project.pages.find((p) => p.id === id);
    if (!page) return;
    this.mutate(() => { page.name = name; }, { reason: 'page' });
  }

  setDevice(deviceId) {
    this.mutate((project) => {
      for (const p of project.pages) {
        if (p.id === project.activePageId) {
          p.deviceId = getDevice(deviceId).id;
          p.customW = null;
          p.customH = null;
        }
      }
    }, { reason: 'device' });
  }

  /** 页面级自定义画布尺寸 */
  setCustomSize(w, h) {
    const W = Math.max(120, Math.min(4000, Math.round(Number(w) || 0)));
    const H = Math.max(200, Math.min(6000, Math.round(Number(h) || 0)));
    this.mutate(() => {
      this.page.customW = W;
      this.page.customH = H;
    }, { reason: 'device' });
  }

  clearCustomSize() {
    this.mutate(() => {
      this.page.customW = null;
      this.page.customH = null;
    }, { reason: 'device' });
  }

  setProjectName(name) {
    this.mutate((project) => { project.name = name; }, { reason: 'meta' });
  }

  /* ---------- 变量 ---------- */
  ensureVariables() {
    if (!Array.isArray(this.project.variables)) this.project.variables = [];
    return this.project.variables;
  }

  addVariable(name, value) {
    const v = { id: uid('v'), name: name || ('var' + (this.ensureVariables().length + 1)), value: value == null ? '' : String(value) };
    this.mutate(() => { this.ensureVariables().push(v); }, { reason: 'vars' });
    return v;
  }

  updateVariable(id, patch) {
    const v = this.ensureVariables().find((x) => x.id === id);
    if (!v) return;
    this.mutate(() => {
      if (patch.name != null) v.name = String(patch.name);
      if (patch.value != null) v.value = String(patch.value);
    }, { reason: 'vars' });
  }

  removeVariable(id) {
    this.mutate(() => {
      this.project.variables = this.ensureVariables().filter((x) => x.id !== id);
    }, { reason: 'vars' });
  }

  variableById(id) {
    return this.ensureVariables().find((x) => x.id === id) || null;
  }

  setPageBg(color) {
    this.mutate(() => { this.page.bg = color; }, { reason: 'meta' });
  }

  /* ---------- 视图 ---------- */
  setZoom(z) {
    this.state.zoom = Math.max(0.1, Math.min(3, z));
    this.state.fitRequested = false;
    this.emit('zoom');
  }

  requestFit() {
    this.state.fitRequested = true;
    this.emit('zoom');
  }

  toggleGrid() { this.state.showGrid = !this.state.showGrid; this.emit('view'); }

  toggleLinks() { this.state.showLinks = !this.state.showLinks; this.emit('view'); }

  /** 标注模式：点元素看规格、导切图 */
  toggleInspect() {
    this.state.inspectMode = !this.state.inspectMode;
    this.emit('view');
  }

  /** 空格按住进入平移模式 */
  setSpacePanning(on) {
    if (this.state.spacePanning === on) return;
    this.state.spacePanning = on;
    this.emit('view');
  }

  /* ---------- 持久化 ---------- */
  persist() {
    try {
      const payload = JSON.stringify(this.project);
      localStorage.setItem(STORAGE_KEY, payload);
    } catch (e) {
      console.warn('[store] 保存失败', e);
    }
  }

  loadFromStorage() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return false;
      this.state.project = normalizeProject(JSON.parse(raw));
      this.state.selection = [];
      this.emit('restore');
      return true;
    } catch (e) {
      console.warn('[store] 读取本地项目失败', e);
      return false;
    }
  }

  loadProject(raw) {
    this.state.project = normalizeProject(raw);
    this.state.selection = [];
    this.undoStack.length = 0;
    this.redoStack.length = 0;
    this.emit('restore');
    this.persist();
  }

  exportJSON() {
    return JSON.stringify(this.project, null, 2);
  }
}

const store = new Store();

/* ===== src/contextmenu.js ===== */
/**
 * 画布右键菜单：由调用方给菜单项，这里只负责定位、显示和关闭。
 */

let menuEl = null;
let currentItems = [];

function ensureMenu() {
  if (menuEl && document.body.contains(menuEl)) return menuEl;
  menuEl = document.createElement('div');
  menuEl.id = 'ctxMenu';
  menuEl.className = 'ctx-menu';
  menuEl.hidden = true;
  document.body.appendChild(menuEl);

  // 点击其它地方关闭
  document.addEventListener('pointerdown', (e) => {
    if (menuEl && !menuEl.hidden && !menuEl.contains(e.target)) hideMenu();
  }, true);
  window.addEventListener('blur', hideMenu);
  window.addEventListener('resize', hideMenu);
  return menuEl;
}

function hideMenu() {
  if (menuEl) menuEl.hidden = true;
  currentItems = [];
}

/**
 * 打开菜单。items: [{ label, hint?, action:()=>void, disabled?, danger?, divider? }]
 */
function openMenu(x, y, items) {
  const el = ensureMenu();
  el.textContent = '';
  currentItems = items || [];

  for (const item of currentItems) {
    if (item.divider) {
      const d = document.createElement('div');
      d.className = 'ctx-divider';
      el.appendChild(d);
      continue;
    }
    const btn = document.createElement('button');
    btn.className = 'ctx-item' + (item.danger ? ' danger' : '');
    btn.textContent = item.label;
    if (item.hint) {
      const h = document.createElement('span');
      h.className = 'ctx-hint';
      h.textContent = item.hint;
      btn.appendChild(h);
    }
    if (item.disabled) {
      btn.disabled = true;
    } else {
      btn.addEventListener('click', () => {
        hideMenu();
        try { item.action(); } catch (e) { console.error('[ctxmenu]', e); }
      });
    }
    el.appendChild(btn);
  }

  el.hidden = false;
  // 先显示再测尺寸，避免超出视口
  const rect = el.getBoundingClientRect();
  const maxX = window.innerWidth - rect.width - 8;
  const maxY = window.innerHeight - rect.height - 8;
  el.style.left = Math.max(8, Math.min(x, maxX)) + 'px';
  el.style.top = Math.max(8, Math.min(y, maxY)) + 'px';
  return el;
}

function isMenuOpen() {
  return !!(menuEl && !menuEl.hidden);
}

/**
 * 左栏面板可拖拽分栏：拖动 .resizer 调整相邻两块面板高度，比例存 localStorage。
 */

const PANE_KEY = 'modao-open:left-panes';

function initResizers(options = {}) {
  const paneIds = options.paneIds || ['panePages', 'paneLayers', 'paneLibrary'];
  const container = options.container || document.querySelector('.left');
  const minHeight = options.minHeight || 72;

  if (!container) return { restore() {}, save() {} };

  function restore() {
    try {
      const saved = JSON.parse(localStorage.getItem(PANE_KEY) || 'null');
      if (!Array.isArray(saved) || saved.length !== paneIds.length) return;
      paneIds.forEach((id, i) => {
        const el = document.getElementById(id);
        if (el && typeof saved[i] === 'number' && saved[i] > 0) {
          el.style.flex = '0 0 ' + saved[i] + '%';
        }
      });
    } catch (e) { /* 坏数据忽略 */ }
  }

  function save() {
    const leftH = container.clientHeight || 1;
    const ratios = paneIds.map((id) => {
      const el = document.getElementById(id);
      if (!el) return 0;
      return Math.round((el.getBoundingClientRect().height / leftH) * 1000) / 10;
    });
    try { localStorage.setItem(PANE_KEY, JSON.stringify(ratios)); } catch (e) { /* 忽略 */ }
    return ratios;
  }

  restore();

  const resizers = container.querySelectorAll('.resizer');
  resizers.forEach((rz) => {
    rz.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      const prev = rz.previousElementSibling;
      const next = rz.nextElementSibling;
      if (!prev || !next) return;

      const startY = e.clientY;
      const startPrev = prev.getBoundingClientRect().height;
      const startNext = next.getBoundingClientRect().height;
      const total = startPrev + startNext;

      function onMove(ev) {
        const dy = ev.clientY - startY;
        const hp = Math.max(minHeight, Math.min(total - minHeight, startPrev + dy));
        prev.style.flex = '0 0 ' + hp + 'px';
        next.style.flex = '0 0 ' + (total - hp) + 'px';
      }

      function onUp() {
        window.removeEventListener('pointermove', onMove);
        save();
      }

      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp, { once: true });
    });
  });

  return { restore, save };
}

/**
 * 主题切换：dark / light / auto（跟随系统），持久化到 localStorage。
 */

const THEME_KEY = 'modao-open:theme';
const THEME_MODES = ['dark', 'light', 'auto'];

const ICONS = {
  light: '<circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>',
  dark: '<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>',
  auto: '<circle cx="12" cy="12" r="8"/><path d="M12 4v16"/>'
};

const TITLES = {
  dark: '当前：深色（点击切到浅色）',
  light: '当前：浅色（点击切到跟随系统）',
  auto: '当前：跟随系统（点击切到深色）'
};

function normalizeMode(mode) {
  return THEME_MODES.indexOf(mode) >= 0 ? mode : 'dark';
}

function getStoredTheme() {
  try {
    const v = localStorage.getItem(THEME_KEY);
    return v ? normalizeMode(v) : 'dark';
  } catch (e) {
    return 'dark';
  }
}

function themeIconMarkup(mode) {
  return ICONS[normalizeMode(mode)] || ICONS.dark;
}

/** 应用主题；返回实际生效的模式 */
function applyTheme(mode, root) {
  const m = normalizeMode(mode);
  const el = root || document.documentElement;
  el.setAttribute('data-theme', m);
  try { localStorage.setItem(THEME_KEY, m); } catch (e) { /* 忽略 */ }

  const btn = document.getElementById('themeBtn');
  if (btn) {
    btn.setAttribute('title', TITLES[m]);
    const svg = btn.querySelector('svg');
    if (svg) svg.innerHTML = ICONS[m];
  }
  return m;
}

/** 循环切换：dark → light → auto → dark */
function cycleTheme(root) {
  const el = root || document.documentElement;
  const cur = normalizeMode(el.getAttribute('data-theme') || getStoredTheme());
  const next = THEME_MODES[(THEME_MODES.indexOf(cur) + 1) % THEME_MODES.length];
  return applyTheme(next, el);
}

/* ===== src/nodes.js ===== */
/**
 * 节点渲染：把数据模型渲染成真实 DOM（画布与预览共用）
 */



function px(v) { return typeof v === 'number' ? v + 'px' : v; }

function svgIcon(name, size, color, strokeWidth) {
  const path = ICONS[name] || ICONS.dot;
  const ns = 'http://www.w3.org/2000/svg';
  const svg = document.createElementNS(ns, 'svg');
  svg.setAttribute('width', String(size));
  svg.setAttribute('height', String(size));
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', color || '#333333');
  svg.setAttribute('stroke-width', String(strokeWidth || 1.7));
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  const p = document.createElementNS(ns, 'path');
  p.setAttribute('d', path);
  svg.appendChild(p);
  return svg;
}

function baseNodeStyle(node) {
  const s = {
    position: 'absolute',
    left: px(node.x),
    top: px(node.y),
    width: px(node.w),
    height: px(node.h),
    boxSizing: 'border-box',
    background: node.bg === 'transparent' ? 'transparent' : node.bg,
    borderRadius: px(node.radius),
    border: (node.borderWidth || 0) > 0 ? px(node.borderWidth) + ' solid ' + (node.borderColor || '#e5e5e5') : 'none',
    boxShadow: node.shadow && node.shadow !== 'none' ? node.shadow : 'none',
    opacity: node.opacity == null ? 1 : node.opacity,
    overflow: 'hidden',
    fontFamily: '"Microsoft YaHei","PingFang SC",sans-serif',
    color: node.color || '#222222',
    fontSize: px(node.fontSize || 16),
    fontWeight: String(node.fontWeight || 400),
    lineHeight: String(node.lineHeight || 1.4),
    textAlign: node.align || 'left',
    transform: node.rotation ? 'rotate(' + node.rotation + 'deg)' : 'none'
  };
  if (node.hidden) s.display = 'none';
  return s;
}

function applyStyle(el, style) {
  for (const k in style) {
    if (Object.prototype.hasOwnProperty.call(style, k)) el.style[k] = style[k];
  }
}

function flexCenter(el, dir) {
  el.style.display = 'flex';
  el.style.alignItems = dir === 'start' ? 'flex-start' : 'center';
  el.style.justifyContent = 'center';
}

/**
 * 创建节点的 DOM。opts.interactive=false 用于预览/导出（不带 pointer 事件）。
 */
function createNodeEl(node, opts = {}) {
  node = viewOf(node);
  const el = document.createElement('div');
  el.className = 'node node-' + node.type;
  el.dataset.id = node.id;
  applyStyle(el, baseNodeStyle(node));

  switch (node.type) {
    case 'text': {
      const pad = node.paddingX || 0;
      el.style.padding = '0 ' + px(pad);
      el.style.display = 'flex';
      el.style.alignItems = node.verticalAlign === 'top' ? 'flex-start' : 'center';
      el.style.justifyContent = node.align === 'center' ? 'center' : (node.align === 'right' ? 'flex-end' : 'flex-start');
      el.style.whiteSpace = 'pre-wrap';
      el.style.wordBreak = 'break-word';
      el.textContent = node.text || '';
      break;
    }
    case 'rect':
    case 'circle':
    case 'card': {
      if (node.text) {
        flexCenter(el);
        el.textContent = node.text;
      }
      break;
    }
    case 'line': {
      el.style.background = node.bg === 'transparent' ? '#f0f0f0' : node.bg;
      break;
    }
    case 'image': {
      if (node.src) {
        const img = document.createElement('img');
        img.src = node.src;
        img.style.width = '100%';
        img.style.height = '100%';
        img.style.objectFit = node.fit || 'cover';
        img.style.display = 'block';
        el.appendChild(img);
        break;
      }
      el.style.display = 'flex';
      el.style.flexDirection = 'column';
      el.style.alignItems = 'center';
      el.style.justifyContent = 'center';
      el.style.gap = '6px';
      el.style.color = node.color || '#999999';
      const pic = svgIcon('image' in ICONS ? 'image' : 'dot', Math.min(28, node.h * 0.3), node.color || '#999999', 1.4);
      el.appendChild(pic);
      if (node.text) {
        const t = document.createElement('div');
        t.textContent = node.text;
        t.style.fontSize = px(node.fontSize || 14);
        t.style.color = node.color || '#999999';
        el.appendChild(t);
      }
      break;
    }
    case 'button': {
      flexCenter(el);
      const t = document.createElement('span');
      t.textContent = node.text || '按钮';
      el.appendChild(t);
      break;
    }
    case 'input': {
      el.style.display = 'flex';
      el.style.alignItems = 'center';
      el.style.paddingLeft = px(node.paddingX == null ? 14 : node.paddingX);
      el.style.paddingRight = px(node.paddingX == null ? 14 : node.paddingX);
      const t = document.createElement('span');
      t.textContent = node.text || '';
      t.style.color = node.color || '#bbbbbb';
      t.style.fontSize = px(node.fontSize || 15);
      t.style.overflow = 'hidden';
      t.style.whiteSpace = 'nowrap';
      t.style.textOverflow = 'ellipsis';
      el.appendChild(t);
      break;
    }
    case 'textarea': {
      el.style.display = 'flex';
      el.style.alignItems = 'flex-start';
      el.style.padding = '10px ' + px(node.paddingX == null ? 14 : node.paddingX);
      const t = document.createElement('span');
      t.textContent = node.text || '';
      t.style.color = node.color || '#bbbbbb';
      t.style.fontSize = px(node.fontSize || 15);
      t.style.whiteSpace = 'pre-wrap';
      el.appendChild(t);
      break;
    }
    case 'checkbox': {
      el.style.display = 'flex';
      el.style.alignItems = 'center';
      el.style.justifyContent = 'center';
      if (node.checked) {
        el.style.background = '#1677ff';
        el.style.borderColor = '#1677ff';
        const c = svgIcon('check', Math.min(node.w, node.h) * 0.7, '#ffffff', 2.4);
        el.appendChild(c);
      }
      break;
    }
    case 'switch': {
      el.style.display = 'flex';
      el.style.alignItems = 'center';
      el.style.justifyContent = node.on ? 'flex-end' : 'flex-start';
      el.style.padding = '2px';
      const knob = document.createElement('div');
      const d = Math.max(6, node.h - 6);
      knob.style.width = px(d);
      knob.style.height = px(d);
      knob.style.borderRadius = '999px';
      knob.style.background = '#ffffff';
      knob.style.boxShadow = '0 1px 3px rgba(0,0,0,.25)';
      el.appendChild(knob);
      break;
    }
    case 'icon': {
      el.style.display = 'flex';
      el.style.alignItems = 'center';
      el.style.justifyContent = 'center';
      const size = Math.min(node.w, node.h);
      el.appendChild(svgIcon(node.icon || 'heart', size, node.color || '#333333', node.strokeWidth || 1.7));
      break;
    }
    case 'badge': {
      flexCenter(el);
      const t = document.createElement('span');
      t.textContent = node.text || '标签';
      el.appendChild(t);
      break;
    }
    case 'listitem': {
      el.style.display = 'flex';
      el.style.alignItems = 'center';
      el.style.paddingLeft = px(node.paddingX == null ? 16 : node.paddingX);
      el.style.paddingRight = px(node.paddingX == null ? 16 : node.paddingX);
      if (node.divider) {
        const line = document.createElement('div');
        line.style.position = 'absolute';
        line.style.left = '0';
        line.style.right = '0';
        line.style.bottom = '0';
        line.style.height = '1px';
        line.style.background = node.dividerColor || '#f0f0f0';
        el.appendChild(line);
      }
      const t = document.createElement('span');
      t.textContent = node.text || '';
      el.appendChild(t);
      break;
    }
    case 'navbar': {
      el.style.display = 'flex';
      el.style.alignItems = 'center';
      el.style.justifyContent = 'center';
      el.style.position = 'absolute';
      const title = document.createElement('span');
      title.textContent = node.text || '';
      el.appendChild(title);

      if (node.showBack) {
        const back = document.createElement('div');
        back.style.position = 'absolute';
        back.style.left = '12px';
        back.style.top = '50%';
        back.style.transform = 'translateY(-50%)';
        back.style.display = 'flex';
        back.appendChild(svgIcon('arrowLeft', 20, node.color || '#222222', 1.8));
        el.appendChild(back);
      }
      if (node.showAction) {
        const act = document.createElement('div');
        act.style.position = 'absolute';
        act.style.right = '12px';
        act.style.top = '50%';
        act.style.transform = 'translateY(-50%)';
        act.style.display = 'flex';
        act.appendChild(svgIcon(node.actionIcon || 'plus', 20, node.color || '#222222', 1.8));
        el.appendChild(act);
      }
      if (node.bottomLine) {
        const line = document.createElement('div');
        line.style.position = 'absolute';
        line.style.left = '0';
        line.style.right = '0';
        line.style.bottom = '0';
        line.style.height = '1px';
        line.style.background = '#f0f0f0';
        el.appendChild(line);
      }
      break;
    }
    case 'tabbar': {
      el.style.display = 'flex';
      el.style.alignItems = 'stretch';
      if (node.topLine) {
        const line = document.createElement('div');
        line.style.position = 'absolute';
        line.style.left = '0';
        line.style.right = '0';
        line.style.top = '0';
        line.style.height = '1px';
        line.style.background = '#f0f0f0';
        el.appendChild(line);
      }
      const tabs = node.tabs || ['待办', '已完成', '我的'];
      for (let i = 0; i < tabs.length; i += 1) {
        const cell = document.createElement('div');
        cell.style.flex = '1';
        cell.style.display = 'flex';
        cell.style.alignItems = 'center';
        cell.style.justifyContent = 'center';
        cell.style.fontSize = px(node.fontSize || 12);
        cell.style.color = i === (node.activeIndex || 0) ? (node.activeColor || '#1677ff') : (node.inactiveColor || '#999999');
        cell.textContent = tabs[i];
        el.appendChild(cell);
      }
      break;
    }
    case 'group': {
      el.style.background = 'transparent';
      el.style.border = 'none';
      el.style.overflow = 'visible';
      for (const child of node.children || []) {
        if (child.hidden) continue;
        el.appendChild(createNodeEl(child, opts));
      }
      break;
    }
    default: {
      if (node.text) {
        flexCenter(el);
        el.textContent = node.text;
      }
    }
  }

  if (opts.interactive === false) {
    el.style.pointerEvents = 'none';
  }
  return el;
}

/** 渲染整页（不含交互按钮），供预览与导出 */
function renderPage(page, opts = {}) {
  const dev = opts.device;
  const host = document.createElement('div');
  host.style.position = 'relative';
  host.style.width = px(dev.w);
  host.style.height = px(dev.h);
  host.style.background = page.bg || '#ffffff';
  host.style.overflow = 'hidden';
  for (const node of page.nodes) {
    if (node.hidden) continue;
    host.appendChild(createNodeEl(node, { interactive: false }));
  }
  return host;
}

/* ===== src/canvas.js ===== */
/**
 * 画布：渲染、选择、拖拽、缩放、对齐参考线、缩放比例
 */



const SNAP = 4;

function createCanvas(ctx) {
  const { canvasHost, nodesLayer, hintsLayer, store } = ctx;

  let dragging = null;   // { startX, startY, items:[{node,x,y}], moved }
  let resizing = null;   // { id, dir, startX, startY, origin }
  let nodeEls = new Map();

  /* ---------------- 渲染 ---------------- */

  function render() {
    const page = store.page;
    const device = store.device;
    canvasHost.style.width = device.w + 'px';
    canvasHost.style.height = device.h + 'px';
    canvasHost.style.background = page.bg || '#ffffff';
    canvasHost.classList.toggle('grid', !!store.state.showGrid);

    nodesLayer.textContent = '';
    nodeEls = new Map();

    for (const node of page.nodes) {
      const el = createNodeEl(node, { interactive: true });
      if (store.isSelected(node.id)) el.classList.add('sel');
      if (node.locked) el.classList.add('locked');
      el.addEventListener('pointerdown', (e) => onNodePointerDown(e, node));
      nodesLayer.appendChild(el);
      nodeEls.set(node.id, el);
    }

    renderSelectionHandles();
    applyZoom();
  }

  function renderSelectionHandles() {
    for (const [id, el] of nodeEls) {
      const old = el.querySelectorAll(':scope > .handle');
      for (const o of old) o.remove();
      if (!store.isSelected(id)) continue;
      const node = store.nodeById(id);
      if (!node || node.locked) continue;
      for (const dir of ['nw', 'n', 'ne', 'e', 'se', 's', 'sw', 'w']) {
        const h = document.createElement('div');
        h.className = 'handle ' + dir;
        h.dataset.dir = dir;
        h.addEventListener('pointerdown', (e) => onHandlePointerDown(e, node, dir));
        el.appendChild(h);
      }
    }
  }

  /* ---------------- 缩放 ---------------- */

  function applyZoom() {
    const z = store.state.zoom;
    canvasHost.style.transform = 'scale(' + z + ')';
    const wrap = canvasHost.parentElement;
    if (wrap) {
      wrap.style.width = (store.device.w * z) + 'px';
      wrap.style.height = (store.device.h * z) + 'px';
    }
  }

  function fit() {
    const scroller = document.getElementById('stageScroll');
    if (!scroller) return;
    const pad = 64;
    const availW = Math.max(120, scroller.clientWidth - pad);
    const availH = Math.max(120, scroller.clientHeight - pad);
    const dev = store.device;
    const z = Math.min(availW / dev.w, availH / dev.h);
    store.state.zoom = Math.max(0.1, Math.min(2, z));
    store.state.fitRequested = false;
    applyZoom();
    store.emit('zoom');
  }

  /* ---------------- 选择 ---------------- */

  function hitTest(target) {
    let el = target;
    while (el && el !== nodesLayer) {
      // 只认页面顶层节点；组内子元素向上冒泡到组
      if (el.dataset && el.dataset.id && store.nodeById(el.dataset.id)) return el.dataset.id;
      el = el.parentElement;
    }
    return null;
  }

  let marquee = null;

  function onCanvasPointerDown(e) {
    if (e.button !== 0) return;
    if (store.state.spacePanning) { startPan(e); return; }
    const id = hitTest(e.target);
    if (id) return; // 点到节点，由节点自己处理

    // 点到空白：立即清空选择（shift 保留，用于框选追加）
    if (!e.shiftKey) store.clearSelection();

    const rect = canvasHost.getBoundingClientRect();
    const zoom = store.state.zoom;
    const sx = (e.clientX - rect.left) / zoom;
    const sy = (e.clientY - rect.top) / zoom;
    marquee = { sx, sy, cx: sx, cy: sy, additive: !!e.shiftKey, box: null, moved: false };
    window.addEventListener('pointermove', onMarqueeMove);
    window.addEventListener('pointerup', onMarqueeUp, { once: true });
  }

  function onMarqueeMove(e) {
    if (!marquee) return;
    const rect = canvasHost.getBoundingClientRect();
    const zoom = store.state.zoom;
    marquee.cx = (e.clientX - rect.left) / zoom;
    marquee.cy = (e.clientY - rect.top) / zoom;
    if (Math.abs(marquee.cx - marquee.sx) > 3 || Math.abs(marquee.cy - marquee.sy) > 3) marquee.moved = true;
    if (!marquee.moved) return;

    if (!marquee.box) {
      const box = document.createElement('div');
      box.style.position = 'absolute';
      box.style.border = '1px dashed #1677ff';
      box.style.background = 'rgba(22,119,255,0.08)';
      box.style.pointerEvents = 'none';
      box.style.zIndex = '8';
      hintsLayer.appendChild(box);
      marquee.box = box;
    }
    const x = Math.min(marquee.sx, marquee.cx);
    const y = Math.min(marquee.sy, marquee.cy);
    marquee.box.style.left = x + 'px';
    marquee.box.style.top = y + 'px';
    marquee.box.style.width = Math.abs(marquee.cx - marquee.sx) + 'px';
    marquee.box.style.height = Math.abs(marquee.cy - marquee.sy) + 'px';
  }

  function onMarqueeUp() {
    window.removeEventListener('pointermove', onMarqueeMove);
    if (!marquee) return;
    const m = marquee;
    marquee = null;
    if (m.box) m.box.remove();

    if (!m.moved) {
      return; // 只是单击空白，上面已经在 pointerdown 时清空了选择
    }

    const x1 = Math.min(m.sx, m.cx);
    const x2 = Math.max(m.sx, m.cx);
    const y1 = Math.min(m.sy, m.cy);
    const y2 = Math.max(m.sy, m.cy);
    const hits = store.page.nodes
      .filter((n) => !n.hidden && !(n.x > x2 || n.x + n.w < x1 || n.y > y2 || n.y + n.h < y1))
      .map((n) => n.id);
    store.select(hits, m.additive);
  }

  function onNodePointerDown(e, node) {
    if (e.button !== 0) return;
    if (store.state.spacePanning) { e.stopPropagation(); startPan(e); return; }
    e.stopPropagation();
    if (store.state.inspectMode) {
      if (ctx.onInspect) ctx.onInspect(node);
      return;
    }
    if (node.locked) return;

    if (e.shiftKey) {
      store.select([node.id], true);
    } else if (!store.isSelected(node.id)) {
      store.select([node.id]);
    }
    renderSelectionHandles();
    for (const [id, el] of nodeEls) el.classList.toggle('sel', store.isSelected(id));

    const zoom = store.state.zoom;
    const items = store.selectedNodes.map((n) => ({ id: n.id, x: n.x, y: n.y }));
    dragging = { startX: e.clientX, startY: e.clientY, items, moved: false, pushed: false, zoom };
    // 先挂监听再 try capture：合成事件下 setPointerCapture 可能抛错，不能让它挡住拖动
    window.addEventListener('pointermove', onDragMove);
    window.addEventListener('pointerup', onDragUp, { once: true });
    try {
      if (e.currentTarget.setPointerCapture) e.currentTarget.setPointerCapture(e.pointerId);
    } catch (err) { /* 合成 pointerId 不支持捕获，忽略 */ }
  }

  function onDragMove(e) {
    if (!dragging) return;
    const dx = (e.clientX - dragging.startX) / dragging.zoom;
    const dy = (e.clientY - dragging.startY) / dragging.zoom;
    if (!dragging.moved && Math.abs(dx) < 1 && Math.abs(dy) < 1) return;

    if (!dragging.moved) {
      dragging.moved = true;
      store.pushHistory();
    }

    const primary = dragging.items[0];
    const target = { x: Math.round(primary.x + dx), y: Math.round(primary.y + dy) };
    const snapped = snapNode(primary.id, target, dragging.items);

    for (const item of dragging.items) {
      const node = store.nodeById(item.id);
      if (!node) continue;
      const isPrimary = item.id === primary.id;
      node.x = isPrimary ? snapped.x : Math.round(item.x + dx + (snapped.x - target.x));
      node.y = isPrimary ? snapped.y : Math.round(item.y + dy + (snapped.y - target.y));
      const el = nodeEls.get(node.id);
      if (el) {
        el.style.left = node.x + 'px';
        el.style.top = node.y + 'px';
      }
    }
    renderHints(snapped.hints);
  }

  function onDragUp() {
    window.removeEventListener('pointermove', onDragMove);
    if (dragging && dragging.moved) {
      dragging = null;
      clearHints();
      store.emit('move');
      store.persist();
      render();
      return;
    }
    dragging = null;
    clearHints();
  }

  /* ---------------- 对齐吸附 ---------------- */

  function snapNode(id, pos, items) {
    const exclude = new Set(items.map((i) => i.id));
    const node = store.nodeById(id);
    if (!node) return { x: pos.x, y: pos.y, hints: [] };
    const device = store.device;
    const targets = [];

    // 画布中心与边距
    targets.push({ kind: 'v', value: Math.round(device.w / 2), label: '画布中心' });
    targets.push({ kind: 'v', value: 16, label: '左边距' });
    targets.push({ kind: 'v', value: device.w - 16, label: '右边距' });
    targets.push({ kind: 'h', value: 16, label: '上边距' });
    targets.push({ kind: 'h', value: device.h - 16, label: '下边距' });

    for (const other of store.page.nodes) {
      if (exclude.has(other.id) || other.hidden) continue;
      targets.push({ kind: 'v', value: other.x, label: other.name || other.type });
      targets.push({ kind: 'v', value: other.x + other.w / 2, label: other.name || other.type });
      targets.push({ kind: 'v', value: other.x + other.w, label: other.name || other.type });
      targets.push({ kind: 'h', value: other.y, label: other.name || other.type });
      targets.push({ kind: 'h', value: other.y + other.h / 2, label: other.name || other.type });
      targets.push({ kind: 'h', value: other.y + other.h, label: other.name || other.type });
    }

    const hints = [];
    let x = pos.x;
    let y = pos.y;

    const myV = [pos.x, pos.x + node.w / 2, pos.x + node.w];
    const myH = [pos.y, pos.y + node.h / 2, pos.y + node.h];

    let bestV = null;
    for (const t of targets) {
      if (t.kind !== 'v') continue;
      for (let i = 0; i < myV.length; i += 1) {
        const d = Math.abs(myV[i] - t.value);
        if (d <= SNAP && (!bestV || d < bestV.d)) bestV = { d, delta: t.value - myV[i], value: t.value, label: t.label };
      }
    }
    if (bestV) {
      x += Math.round(bestV.delta);
      hints.push({ kind: 'v', value: bestV.value, label: bestV.label });
    }

    let bestH = null;
    for (const t of targets) {
      if (t.kind !== 'h') continue;
      for (let i = 0; i < myH.length; i += 1) {
        const d = Math.abs(myH[i] - t.value);
        if (d <= SNAP && (!bestH || d < bestH.d)) bestH = { d, delta: t.value - myH[i], value: t.value, label: t.label };
      }
    }
    if (bestH) {
      y += Math.round(bestH.delta);
      hints.push({ kind: 'h', value: bestH.value, label: bestH.label });
    }

    return { x, y, hints };
  }

  function renderHints(hints) {
    clearHints();
    if (!hints || !hints.length) return;
    const device = store.device;
    for (const hint of hints) {
      const line = document.createElement('div');
      line.className = 'hint-line';
      if (hint.kind === 'v') {
        line.style.left = hint.value + 'px';
        line.style.top = '0';
        line.style.width = '1px';
        line.style.height = device.h + 'px';
      } else {
        line.style.top = hint.value + 'px';
        line.style.left = '0';
        line.style.height = '1px';
        line.style.width = device.w + 'px';
      }
      hintsLayer.appendChild(line);
    }
  }

  function clearHints() {
    hintsLayer.textContent = '';
  }

  /* ---------------- 缩放节点 ---------------- */

  function onHandlePointerDown(e, node, dir) {
    e.stopPropagation();
    e.preventDefault();
    resizing = {
      id: node.id,
      dir,
      startX: e.clientX,
      startY: e.clientY,
      zoom: store.state.zoom,
      origin: { x: node.x, y: node.y, w: node.w, h: node.h },
      pushed: false
    };
    window.addEventListener('pointermove', onResizeMove);
    window.addEventListener('pointerup', onResizeUp, { once: true });
  }

  function onResizeMove(e) {
    if (!resizing) return;
    const dx = (e.clientX - resizing.startX) / resizing.zoom;
    const dy = (e.clientY - resizing.startY) / resizing.zoom;
    const o = resizing.origin;
    const node = store.nodeById(resizing.id);
    if (!node) return;

    if (!resizing.pushed) { store.pushHistory(); resizing.pushed = true; }

    let x = o.x, y = o.y, w = o.w, h = o.h;
    if (resizing.dir.indexOf('e') >= 0) w = Math.max(4, Math.round(o.w + dx));
    if (resizing.dir.indexOf('s') >= 0) h = Math.max(2, Math.round(o.h + dy));
    if (resizing.dir.indexOf('w') >= 0) {
      w = Math.max(4, Math.round(o.w - dx));
      x = Math.round(o.x + (o.w - w));
    }
    if (resizing.dir.indexOf('n') >= 0) {
      h = Math.max(2, Math.round(o.h - dy));
      y = Math.round(o.y + (o.h - h));
    }
    node.x = x; node.y = y; node.w = w; node.h = h;

    const el = nodeEls.get(node.id);
    if (el) {
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.style.width = w + 'px';
      el.style.height = h + 'px';
    }
  }

  function onResizeUp() {
    window.removeEventListener('pointermove', onResizeMove);
    resizing = null;
    store.emit('resize');
    store.persist();
    render();
  }

  /* ---------------- Ctrl+滚轮缩放 ---------------- */

  canvasHost.addEventListener('wheel', (e) => {
    if (!e.ctrlKey && !e.metaKey) return;
    e.preventDefault();
    const scroller = document.getElementById('stageScroll');
    const rect = canvasHost.getBoundingClientRect();
    const px = (e.clientX - rect.left) / store.state.zoom;
    const py = (e.clientY - rect.top) / store.state.zoom;
    const oldZoom = store.state.zoom;
    const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
    const next = Math.max(0.1, Math.min(3, oldZoom * factor));
    if (Math.abs(next - oldZoom) < 0.0001) return;
    store.setZoom(next);
    if (scroller) {
      // 让鼠标下的画布点尽量留在原位
      scroller.scrollLeft += px * (next - oldZoom);
      scroller.scrollTop += py * (next - oldZoom);
    }
  }, { passive: false });

  /* ---------------- 空格拖拽平移 ---------------- */

  let panning = null;

  function startPan(e) {
    const scroller = document.getElementById('stageScroll');
    if (!scroller) return;
    panning = { sx: e.clientX, sy: e.clientY, sl: scroller.scrollLeft, st: scroller.scrollTop, scroller };
    window.addEventListener('pointermove', onPanMove);
    window.addEventListener('pointerup', stopPan, { once: true });
  }

  function onPanMove(e) {
    if (!panning) return;
    panning.scroller.scrollLeft = panning.sl - (e.clientX - panning.sx);
    panning.scroller.scrollTop = panning.st - (e.clientY - panning.sy);
  }

  function stopPan() {
    window.removeEventListener('pointermove', onPanMove);
    panning = null;
  }

  /* ---------------- 右键菜单 ---------------- */

  canvasHost.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    // 用事件目标找节点（elementFromPoint 在某些合成事件/缩放场景下不可靠）
    const nodeEl = e.target && e.target.closest ? e.target.closest('.node') : null;
    let id = null;
    if (nodeEl && nodeEl.dataset && nodeEl.dataset.id && store.nodeById(nodeEl.dataset.id)) {
      id = nodeEl.dataset.id;
    }
    if (id && !store.isSelected(id)) store.select([id]);
    if (ctx.onContextMenu) ctx.onContextMenu(e.clientX, e.clientY, id);
  });

  /* ---------------- 初始化 ---------------- */

  canvasHost.addEventListener('pointerdown', onCanvasPointerDown);

  return { render, fit, applyZoom };
}

function svgIcon(d, size) {
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('width', String(size || 13));
  svg.setAttribute('height', String(size || 13));
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '1.7');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  const p = document.createElementNS(NS, 'path');
  p.setAttribute('d', d);
  svg.appendChild(p);
  return svg;
}

function renderPageList(container, store, handlers) {
  container.textContent = '';
  const project = store.project;

  for (const page of project.pages) {
    const row = document.createElement('div');
    row.className = 'page-item' + (page.id === project.activePageId ? ' active' : '');

    const dot = document.createElement('span');
    dot.className = 'p-icon';
    dot.appendChild(svgIcon('M4 5h16v14H4zM4 9h16', 12));
    row.appendChild(dot);

    const name = document.createElement('span');
    name.className = 'pname';
    name.textContent = page.name;
    name.title = '双击重命名';
    name.addEventListener('dblclick', (e) => {
      e.stopPropagation();
      const next = prompt('页面名称', page.name);
      if (next && next.trim()) store.renamePage(page.id, next.trim());
    });
    row.appendChild(name);

    const del = document.createElement('span');
    del.className = 'del';
    del.textContent = '✕';
    del.title = '删除页面';
    del.addEventListener('click', (e) => {
      e.stopPropagation();
      if (store.project.pages.length <= 1) return handlers.toast('至少保留一个页面');
      if (confirm('删除页面「' + page.name + '」？')) store.deletePage(page.id);
    });
    row.appendChild(del);

    row.addEventListener('click', () => store.setActivePage(page.id));
    container.appendChild(row);
  }
}

/** 图层列表：当前页所有元素，最上层显示在最前 */
function renderLayerList(container, store, handlers) {
  if (!container) return;
  container.textContent = '';
  const page = store.page;
  const nodes = page.nodes.slice().reverse();

  if (!nodes.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-hint';
    empty.style.padding = '2px 10px 10px';
    empty.textContent = '本页还没有元素';
    container.appendChild(empty);
    return;
  }

  for (const node of nodes) {
    const path = LAYER_ICONS[node.type] || LAYER_ICONS.rect;
    const label = LAYER_LABELS[node.type] || node.type;

    const row = document.createElement('div');
    row.className = 'layer-item' + (store.isSelected(node.id) ? ' active' : '');
    if (node.hidden) row.classList.add('is-hidden');

    const g = document.createElement('span');
    g.className = 'l-icon';
    g.appendChild(svgIcon(path, 13));
    row.appendChild(g);

    const name = document.createElement('span');
    name.className = 'l-name';
    const text = (node.text || '').replace(/\s+/g, ' ').trim();
    if (node.type === 'group') {
      name.textContent = '分组（' + ((node.children && node.children.length) || 0) + '）';
    } else {
      name.textContent = text ? text.slice(0, 14) : label;
    }
    name.title = label + (text ? '：' + text : '');
    row.appendChild(name);

    const eye = document.createElement('button');
    eye.className = 'mini l-btn';
    eye.appendChild(svgIcon(node.hidden ? EYE_OFF : EYE_ON, 12));
    eye.title = node.hidden ? '显示' : '隐藏';
    eye.addEventListener('click', (e) => {
      e.stopPropagation();
      store.updateNode(node.id, { hidden: !node.hidden });
    });
    row.appendChild(eye);

    const lock = document.createElement('button');
    lock.className = 'mini l-btn';
    lock.appendChild(svgIcon(node.locked ? LOCK_ON : LOCK_OFF, 12));
    lock.title = node.locked ? '解锁' : '锁定';
    lock.addEventListener('click', (e) => {
      e.stopPropagation();
      store.updateNode(node.id, { locked: !node.locked });
    });
    row.appendChild(lock);

    row.addEventListener('click', (e) => {
      store.select([node.id], e.shiftKey);
    });

    container.appendChild(row);
  }
}

const CATEGORY_LABELS = { basic: '基础', form: '表单', layout: '布局', icon: '图标' };
const CATEGORY_ORDER = ['basic', 'form', 'layout', 'icon'];

function makeLibItem(comp, handlers) {
  const item = document.createElement('div');
  item.className = 'lib-item';
  item.title = '添加' + comp.label;
  item.draggable = true;

  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('width', '20');
  svg.setAttribute('height', '20');
  svg.setAttribute('viewBox', '0 0 24 24');
  svg.setAttribute('fill', 'none');
  svg.setAttribute('stroke', 'currentColor');
  svg.setAttribute('stroke-width', '1.6');
  svg.setAttribute('stroke-linecap', 'round');
  svg.setAttribute('stroke-linejoin', 'round');
  svg.innerHTML = comp.icon;
  item.appendChild(svg);

  const label = document.createElement('span');
  label.textContent = comp.label;
  item.appendChild(label);

  item.addEventListener('click', () => handlers.addComponent(comp.type));
  item.addEventListener('dragstart', (e) => {
    e.dataTransfer.setData('text/plain', comp.type);
    e.dataTransfer.effectAllowed = 'copy';
  });
  return item;
}

/**
 * 组件库。keyword 非空时按名称/类型过滤并平铺；否则按分类分组显示。
 */
function renderLibrary(container, store, handlers, keyword) {
  if (!container) return;
  container.textContent = '';

  const kw = String(keyword || '').trim().toLowerCase();
  const list = COMPONENTS.filter((c) => {
    if (!kw) return true;
    return c.label.toLowerCase().indexOf(kw) >= 0 || c.type.toLowerCase().indexOf(kw) >= 0;
  });

  if (!list.length) {
    const empty = document.createElement('div');
    empty.className = 'empty-hint lib-empty';
    empty.style.gridColumn = '1 / -1';
    empty.style.padding = '10px 4px';
    empty.textContent = '没有匹配「' + keyword + '」的组件';
    container.appendChild(empty);
    return;
  }

  if (kw) {
    for (const comp of list) container.appendChild(makeLibItem(comp, handlers));
    return;
  }

  for (const cat of CATEGORY_ORDER) {
    const group = list.filter((c) => (c.category || 'basic') === cat);
    if (!group.length) continue;
    const title = document.createElement('div');
    title.className = 'lib-group-title';
    title.textContent = CATEGORY_LABELS[cat] || cat;
    container.appendChild(title);
    for (const comp of group) container.appendChild(makeLibItem(comp, handlers));
  }
}
